<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Siluetas por grupo</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&amp;family=Instrument+Sans:wght@400..700&amp;family=Instrument+Serif:ital@0;1&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 1280px; height: 720px; box-sizing: border-box; overflow: hidden; padding: 56px 64px; background: #F3EDE2; color: #14302F; font-family: 'Instrument Sans', 'Segoe UI', system-ui, sans-serif; display: flex; flex-direction: column; gap: 24px">

<header style="display: flex; flex-direction: column; gap: 8px">
<h1 style="margin: 0; font-family: 'Bricolage Grotesque', 'Avenir Next', system-ui, sans-serif; font-size: 40px; font-weight: 800; line-height: 1.05; letter-spacing: -0.02em">Siluetas para las aves en sombra</h1>
<p style="margin: 0; font-size: 18px; line-height: 1.4; color: #4E5E5C">24 grupos cubren las 289 especies. Cada especie usa la silueta de su grupo hasta que la registras; el número indica cuántas la comparten.</p>
</header>

<div style="display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); gap: 16px">
<sc-for list="{{grupos}}" as="g" hint-placeholder-count="24">
<div style="display: flex; flex-direction: column; gap: 6px">
<div style="height: 104px; border-radius: 12px; background: #E7E1D5; display: flex; align-items: center; justify-content: center">
<img src="{{g.img}}" alt="" style="width: 96px; height: 96px; filter: brightness(0); opacity: 0.62">
</div>
<div style="display: flex; align-items: baseline; justify-content: space-between; gap: 6px">
<span style="font-size: 14px; font-weight: 700">{{g.nombre}}</span>
<span style="font-size: 13px; color: #4E5E5C">{{g.n}}</span>
</div>
</div>
</sc-for>
</div>

</div>
</x-dc>
