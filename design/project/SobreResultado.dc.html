<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Lo que trajo tu sobre</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&amp;family=Instrument+Sans:wght@400..700&amp;family=Instrument+Serif:ital@0;1&amp;display=swap">
<style>
body{margin:0}
a{color:#F3EDE2}a:hover{color:#FFFFFF}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; box-sizing: border-box; overflow: hidden; background: radial-gradient(circle at 50% 34%, #24504D 0%, #0F2423 64%); color: #FFFFFF; font-family: 'Instrument Sans', 'Segoe UI', system-ui, sans-serif; display: flex; flex-direction: column">

<div aria-hidden="true" style="position: absolute; left: -105px; top: 0; width: 600px; height: 600px; border-radius: 50%; background: radial-gradient(circle, rgba(15,36,35,0) 18%, #0F2423 66%), repeating-conic-gradient(from 0deg, rgba(243,237,226,0) 0deg 8deg, rgba(243,237,226,0.07) 8deg 16deg)"></div>

<header style="position: relative; flex: none; height: 56px; padding: 0 8px; display: flex; align-items: center; justify-content: space-between">
<a href="Inicio.dc.html" aria-label="Cerrar" style="width: 44px; height: 44px; border-radius: 12px; display: flex; align-items: center; justify-content: center; color: #F3EDE2">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg>
</a>
<span style="font-size: 13px; font-weight: 700; color: #F3EDE2; background: rgba(243,237,226,0.12); border: 1px solid rgba(243,237,226,0.24); border-radius: 999px; padding: 6px 12px">{{etiqueta}}</span>
<span aria-hidden="true" style="width: 44px"></span>
</header>

<sc-if value="{{mejora}}" hint-placeholder-val="{{ true }}">
<div style="position: relative; flex: none; height: 318px; display: flex; align-items: center; justify-content: center">
<div style="transform: rotate(-4deg); filter: drop-shadow(0 0 28px rgba(201,208,213,0.5))">
<dc-import name="StickerAve" img="/_blob/95828bd5b7fe0dda93d787c2e178af86" nombre="Gaviota Peruana" num="022" tint="#D2E4EC" acabado="plata" size="216" hint-size="216px,277px"></dc-import>
</div>
</div>
<section role="status" style="position: relative; flex: none; padding: 6px 28px 0; display: flex; flex-direction: column; align-items: center; gap: 4px; text-align: center">
<span style="font-size: 13px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: #F2EAB8">¡Mejora tu álbum!</span>
<h1 style="margin: 2px 0 0; font-family: 'Bricolage Grotesque', 'Avenir Next', system-ui, sans-serif; font-size: 32px; font-weight: 800; letter-spacing: -0.015em; line-height: 1.05">Gaviota Peruana</h1>
<span style="font-family: 'Instrument Serif', Georgia, serif; font-style: italic; font-size: 20px; color: #C9D8D4">Larus belcheri</span>
<p style="margin: 6px 0 0; font-size: 14.5px; line-height: 1.45; color: #C9D8D4; text-wrap: pretty">Ganaste la plata en un sobre. Ya se pegó en su casilla.</p>
</section>
<div style="position: relative; margin-top: auto; padding: 0 20px 24px; display: flex; flex-direction: column; gap: 10px; flex: none">
<dc-import name="Boton" texto="Ver en el álbum" variante="claro" href="Album.dc.html" ancho="350" hint-size="350px,52px"></dc-import>
<button onClick="{{siguiente}}" style="min-height: 48px; box-sizing: border-box; border-radius: 14px; border: 1.5px solid rgba(243,237,226,0.45); background: transparent; color: #F3EDE2; font-family: inherit; font-size: 15px; font-weight: 700; cursor: pointer">Abrir el siguiente sobre</button>
</div>
</sc-if>

<sc-if value="{{repetida}}" hint-placeholder-val="{{ false }}">
<div style="position: relative; flex: none; height: 318px; display: flex; align-items: center; justify-content: center">
<div style="transform: rotate(-4deg); filter: drop-shadow(0 0 24px rgba(247,222,142,0.35))">
<dc-import name="StickerAve" img="/_blob/18a594851a3daeba964a8c03ebaaf837" nombre="Churrete Marisquero" num="042" tint="#D2E4EC" acabado="oro" size="216" hint-size="216px,277px"></dc-import>
</div>
<span style="position: absolute; left: 50%; bottom: 8px; transform: translateX(-50%); font-size: 12.5px; font-weight: 700; color: #14302F; background: #F2EAB8; border-radius: 999px; padding: 4px 11px; white-space: nowrap">Repetida</span>
</div>
<section role="status" style="position: relative; flex: none; padding: 6px 28px 0; display: flex; flex-direction: column; align-items: center; gap: 4px; text-align: center">
<span style="font-size: 13px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: #F2EAB8">Oro repetido</span>
<h1 style="margin: 2px 0 0; font-family: 'Bricolage Grotesque', 'Avenir Next', system-ui, sans-serif; font-size: 32px; font-weight: 800; letter-spacing: -0.015em; line-height: 1.05">Churrete Marisquero</h1>
<span style="font-family: 'Instrument Serif', Georgia, serif; font-style: italic; font-size: 20px; color: #C9D8D4">Cinclodes taczanowskii</span>
<p style="margin: 6px 0 0; font-size: 14.5px; line-height: 1.45; color: #C9D8D4; text-wrap: pretty">Ya tienes este acabado. Guárdala para cambiarla, que rinde más, o recíclala por plumas.</p>
</section>
<div style="position: relative; margin-top: auto; padding: 0 20px 24px; display: flex; flex-direction: column; gap: 10px; flex: none">
<dc-import name="Boton" texto="Guardar" variante="claro" href="MisRepetidas.dc.html" ancho="350" hint-size="350px,52px"></dc-import>
<a href="MisRepetidas.dc.html" style="min-height: 48px; box-sizing: border-box; border-radius: 14px; border: 1.5px solid rgba(243,237,226,0.45); color: #F3EDE2; font-size: 15px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none"><dc-import name="MonedaPluma" size="20" hint-size="20px,20px"></dc-import>Reciclar · 5 plumas</a>
</div>
</sc-if>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"caso":{"editor":"enum","options":["mejora","repetida"],"default":"mejora"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { siguiente: false };
  }
  renderVals() {
    const repetida = this.state.siguiente || this.props.caso === 'repetida';
    return {
      mejora: !repetida,
      repetida,
      etiqueta: repetida ? 'Sobre 2 de 2' : 'Sobre 1 de 2',
      siguiente: () => this.setState({ siguiente: true })
    };
  }
}
</script>
</body>
</html>
