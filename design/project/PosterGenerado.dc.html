<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Póster generado · Mis aves de Ica</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Instrument+Sans:wght@400..700&family=Instrument+Serif:ital@0;1&display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="position: relative; width: 1123px; height: 1587px; box-sizing: border-box; overflow: hidden; padding: 72px; background: radial-gradient(circle, rgba(20,48,47,0.09) 1.3px, rgba(20,48,47,0) 1.7px) 0 0 / 28px 28px, #F3EDE2; color: #14302F; font-family: 'Instrument Sans', 'Segoe UI', system-ui, sans-serif; display: flex; flex-direction: column; justify-content: space-between">

<header style="display: flex; align-items: flex-end; justify-content: space-between; gap: 32px">
<div style="display: flex; flex-direction: column; gap: 8px; min-width: 0">
<span style="font-size: 16px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: #2C6A86">Álbum Aves de Ica · Edición inicial</span>
<h1 style="margin: 0; font-family: 'Bricolage Grotesque', 'Avenir Next', system-ui, sans-serif; font-size: 90px; font-weight: 800; line-height: 1; letter-spacing: -0.025em; white-space: nowrap">Mis aves de Ica</h1>
<span style="font-family: 'Instrument Serif', Georgia, serif; font-style: italic; font-size: 30px; line-height: 1.2; color: #4E5E5C">{{subtitulo}}</span>
</div>
<div style="flex: none; width: 150px; height: 150px; box-sizing: border-box; border-radius: 50%; background: #14302F; color: #F3EDE2; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 0; box-shadow: 0 0 0 6px #F3EDE2, 0 0 0 8px #14302F">
<span style="font-size: 13px; font-weight: 700; letter-spacing: 0.16em; text-transform: uppercase">Póster</span>
<span style="font-family: 'Bricolage Grotesque', 'Avenir Next', system-ui, sans-serif; font-size: 62px; font-weight: 800; line-height: 1; color: #E4C766">{{numero}}</span>
<span style="font-size: 13px; font-weight: 600">{{meta}}</span>
</div>
</header>

<div style="position: relative; width: 979px; height: 1080px">
<sc-for list="{{slots}}" as="s" hint-placeholder-count="10">
<div style="position: absolute; left: {{s.x}}px; top: {{s.y}}px; transform: rotate({{s.rot}}deg)">
<sc-if value="{{s.lleno}}" hint-placeholder-val="{{ true }}">
<dc-import name="StickerAve" img="{{s.img}}" nombre="{{s.nombre}}" num="{{s.num}}" tint="{{s.tint}}" acabado="{{s.acabado}}" size="{{s.w}}" hint-size="{{s.hint}}"></dc-import>
</sc-if>
<sc-if value="{{s.vacio}}" hint-placeholder-val="{{ false }}">
<div style="width: {{s.w}}px; height: {{s.h}}px; box-sizing: border-box; border-radius: 18px; border: 3px dashed #B9AE99; background: rgba(251,248,242,0.55); display: flex; align-items: center; justify-content: center; font-family: 'Bricolage Grotesque', 'Avenir Next', system-ui, sans-serif; font-size: 72px; font-weight: 800; color: #C9BEA9">?</div>
</sc-if>
</div>
</sc-for>
<sc-if value="{{bloqueado}}" hint-placeholder-val="{{ false }}">
<div style="position: absolute; left: 359px; top: 410px; width: 260px; height: 260px; box-sizing: border-box; border-radius: 50%; background: #FBF8F2; border: 4px solid #14302F; display: flex; flex-direction: column; align-items: center; justify-content: center; box-shadow: 0 12px 30px rgba(20,48,47,0.18)">
<span style="font-family: 'Bricolage Grotesque', 'Avenir Next', system-ui, sans-serif; font-size: 76px; font-weight: 800; line-height: 1; letter-spacing: -0.03em">{{progreso}}</span>
<span style="font-size: 18px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: #3F504E">especies</span>
</div>
</sc-if>
</div>

<footer style="border-top: 2px solid #14302F; padding-top: 16px; display: flex; justify-content: space-between; gap: 24px; font-size: 16px; color: #3F504E">
<span style="font-weight: 700; color: #14302F">[Nombre del coleccionista]</span>
<span>{{pie}}</span>
</footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"numero":{"editor":"int","default":1,"min":1,"max":29},"seed":{"editor":"int","default":7,"min":1,"max":9999},"bloqueado":{"editor":"boolean","default":false},"$preview":{"width":1123,"height":1587}}'>
class Component extends DCLogic {
  renderVals() {
    const T = { LIT: '#D2E4EC', HUM: '#D9EADB', DES: '#EADFCB' };
    const pool = [
      { num: '038', nombre: 'Pelícano Peruano', img: '/_blob/92d0b07d7a6b9d699e834111a098ce4a', tint: T.LIT },
      { num: '022', nombre: 'Gaviota Peruana', img: '/_blob/95828bd5b7fe0dda93d787c2e178af86', tint: T.LIT },
      { num: '106', nombre: 'Lechuza Terrestre', img: '/_blob/380612587e53c68fbb5b4ef6dac14ce7', tint: T.DES },
      { num: '077', nombre: 'Garcita Blanca', img: '/_blob/d2e03e73fd6b3ebda1ddb6b5afcc6dbb', tint: T.HUM },
      { num: '035', nombre: 'Piquero Peruano', img: '/_blob/48f636337e470379dd8bdaa2851aa67e', tint: T.LIT },
      { num: '025', nombre: 'Gaviotín Zarcillo', img: '/_blob/cdb078ae3f20d0b791f60aa76ef64daf', tint: T.LIT, cromo: true },
      { num: '032', nombre: 'Pingüino de Humboldt', img: '/_blob/5fc0580c91c07a04c8b7ce42a3c9a6d2', tint: T.LIT },
      { num: '050', nombre: 'Flamenco Chileno', img: '/_blob/134f420a8833e17a10978048f13b57fd', tint: T.HUM },
      { num: '005', nombre: 'Ostrero Negruzco', img: '/_blob/ad333582f63fc034b5502953c14b64de', tint: T.LIT },
      { num: '061', nombre: 'Cigüeñuela de Cuello Negro', img: '/_blob/6296ffe1eefbe10536c55645e57fd551', tint: T.HUM }
    ];
    const pos = [
      { x: 20, y: 0, w: 270, rot: -5 },
      { x: 345, y: 30, w: 250, rot: 3 },
      { x: 650, y: 0, w: 290, rot: -3 },
      { x: 0, y: 380, w: 220, rot: 4 },
      { x: 245, y: 400, w: 230, rot: -6 },
      { x: 500, y: 385, w: 220, rot: 5 },
      { x: 745, y: 400, w: 225, rot: -4 },
      { x: 40, y: 700, w: 280, rot: 3 },
      { x: 360, y: 720, w: 260, rot: -4 },
      { x: 660, y: 690, w: 290, rot: 5 }
    ];
    const bloqueado = this.props.bloqueado === true || this.props.bloqueado === 'true';
    let a = (Number(this.props.seed ?? 7) || 7) >>> 0;
    const rand = function () {
      a = (a + 0x6D2B79F5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
    const order = pool.slice();
    for (let i = order.length - 1; i > 0; i--) {
      const j = Math.floor(rand() * (i + 1));
      const tmp = order[i]; order[i] = order[j]; order[j] = tmp;
    }
    const slots = pos.map(function (p, i) {
      const sp = order[i];
      const h = Math.round(p.w * 205 / 160);
      return {
        x: p.x, y: p.y, w: p.w, h: h, rot: p.rot,
        hint: p.w + 'px,' + h + 'px',
        lleno: !bloqueado, vacio: bloqueado,
        img: sp.img, nombre: sp.nombre, num: sp.num, tint: sp.tint,
        acabado: sp.cromo ? 'cromado' : 'normal'
      };
    });
    const numero = Number(this.props.numero ?? 1) || 1;
    return {
      slots: slots,
      bloqueado: bloqueado,
      numero: String(numero),
      progreso: '12/20',
      meta: bloqueado ? 'en camino' : (numero * 10) + ' especies',
      subtitulo: bloqueado ? 'Se arma al llegar a ' + (numero * 10) + ' especies, con 10 stickers al azar' : '10 de tus stickers, elegidos al azar · marzo a octubre de 2026',
      pie: bloqueado ? 'Te faltan 8 especies · trae la medalla de ' + (numero * 10) : 'Póster ' + numero + ' · 9 oct 2026 · medalla de ' + (numero * 10) + ' especies'
    };
  }
}
</script>
</body>
</html>
