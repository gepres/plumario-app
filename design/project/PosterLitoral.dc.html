<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Póster · Aves del litoral de Ica</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Instrument+Sans:wght@400..700&family=Instrument+Serif:ital@0;1&display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="position: relative; width: 1123px; height: 1587px; box-sizing: border-box; overflow: hidden; padding: 72px; background: #F3EDE2; color: #14302F; font-family: 'Instrument Sans', 'Segoe UI', system-ui, sans-serif; display: flex; flex-direction: column; gap: 24px">

<div aria-hidden="true" style="position: absolute; right: -180px; top: -200px; width: 620px; height: 620px; border-radius: 50%; background: #E9DFCC"></div>

<header style="position: relative; display: flex; align-items: flex-end; justify-content: space-between; gap: 40px">
<div style="display: flex; flex-direction: column; gap: 12px; max-width: 760px">
<span style="font-size: 16px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: #2C6A86">Edición inicial · Región Ica, Perú</span>
<h1 style="margin: 0; font-family: 'Bricolage Grotesque', 'Avenir Next', system-ui, sans-serif; font-size: 112px; font-weight: 800; line-height: 0.92; letter-spacing: -0.025em; text-wrap: balance">Aves del litoral de Ica</h1>
<span style="font-family: 'Instrument Serif', Georgia, serif; font-style: italic; font-size: 32px; line-height: 1.2; color: #4E5E5C">Ocho especies de la costa del Pacífico</span>
</div>
<div style="flex: none; width: 176px; height: 176px; box-sizing: border-box; border-radius: 50%; border: 2px solid #2C6A86; background: #F3EDE2; display: flex; align-items: center; justify-content: center">
<div style="width: 156px; height: 156px; box-sizing: border-box; border-radius: 50%; border: 1.5px dashed #2C6A86; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; text-align: center">
<span style="font-family: 'Bricolage Grotesque', 'Avenir Next', system-ui, sans-serif; font-size: 50px; font-weight: 800; line-height: 1; color: #2C6A86">8/8</span>
<span style="font-size: 13px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: #14302F">Colección<br>completa</span>
<span style="font-size: 13px; color: #4E5E5C">23·10·2026</span>
</div>
</div>
</header>

<svg width="979" height="28" viewBox="0 0 979 28" aria-hidden="true" style="position: relative; flex: none; display: block">
<path d="M0 14 q20 -12 40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0" fill="none" stroke="#2C6A86" stroke-width="2.5" stroke-linecap="round"></path>
</svg>

<div style="position: relative; flex: 1; min-height: 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); grid-template-rows: repeat(4, minmax(0, 1fr)); column-gap: 48px">
<sc-for list="{{species}}" as="sp" hint-placeholder-count="8">
<div style="border-top: 1.5px solid #CFC5B3; display: flex; align-items: center; gap: 24px; padding: 18px 0; min-width: 0">
<sc-if value="{{sp.ilus}}" hint-placeholder-val="{{ true }}">
<div style="position: relative; flex: none; width: 200px; height: 200px; border-radius: 50%; background: {{sp.tint}}">
<div style="position: absolute; left: 8px; top: 8px; width: 184px; height: 184px; box-sizing: border-box; border-radius: 50%; border: 1.5px dashed rgba(20,48,47,0.25)"></div>
<img src="{{sp.img}}" alt="" style="position: absolute; left: 14px; top: 10px; width: 172px; height: 172px">
</div>
</sc-if>
<sc-if value="{{sp.fotos}}" hint-placeholder-val="{{ false }}">
<div style="flex: none; width: 240px; height: 200px; display: flex; align-items: center; justify-content: center">
<div style="width: {{sp.pw}}px; height: {{sp.ph}}px; padding: 6px; background: #FFFFFF; box-shadow: 0 1px 2px rgba(20,48,47,0.2), 0 6px 14px rgba(20,48,47,0.12)">
<div style="width: 100%; height: 100%; background: #C9D7DC; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; color: #3F504E">
<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4z"></path><circle cx="12" cy="13" r="3.5"></circle></svg>
<span style="font-size: 14px; font-weight: 600">Tu foto · {{sp.ratio}}</span>
</div>
</div>
</div>
</sc-if>
<div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 6px">
<span style="font-size: 15px; font-weight: 700; letter-spacing: 0.08em; color: #2C6A86">N.º {{sp.n}}</span>
<span style="font-family: 'Bricolage Grotesque', 'Avenir Next', system-ui, sans-serif; font-size: 34px; font-weight: 700; line-height: 1.05; letter-spacing: -0.01em; text-wrap: balance">{{sp.name}}</span>
<span style="font-family: 'Instrument Serif', Georgia, serif; font-style: italic; font-size: 26px; line-height: 1.15; color: #4E5E5C">{{sp.sci}}</span>
</div>
</div>
</sc-for>
</div>

<footer style="position: relative; flex: none; border-top: 2px solid #14302F; padding-top: 16px; display: flex; justify-content: space-between; gap: 24px; font-size: 15px; color: #3F504E">
<span style="font-weight: 700; color: #14302F">Álbum Aves de Ica · Póster de recompensa</span>
<span>{{credit}}</span>
</footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"variant":{"editor":"enum","options":["ilustrado","fotos"],"default":"ilustrado"},"$preview":{"width":1123,"height":1587}}'>
class Component extends DCLogic {
  renderVals() {
    const A = {
      pinguino: '/_blob/5fc0580c91c07a04c8b7ce42a3c9a6d2',
      pelicano: '/_blob/92d0b07d7a6b9d699e834111a098ce4a',
      zarcillo: '/_blob/cdb078ae3f20d0b791f60aa76ef64daf',
      piquero: '/_blob/48f636337e470379dd8bdaa2851aa67e',
      gaviota: '/_blob/95828bd5b7fe0dda93d787c2e178af86',
      ostrero: '/_blob/ad333582f63fc034b5502953c14b64de',
      gaviotin: '/_blob/4872b8efc92794f43c266dd9d5443ff9',
      playero: '/_blob/700e5a92d8dae9ed43cb6af87296da4a'
    };
    const species = [
      { n: '01', name: 'Pingüino de Humboldt', sci: 'Spheniscus humboldti', img: A.pinguino, tint: '#D2E4EC', pw: 228, ph: 171, ratio: '4:3' },
      { n: '02', name: 'Pelícano peruano', sci: 'Pelecanus thagus', img: A.pelicano, tint: '#EADFCB', pw: 228, ph: 152, ratio: '3:2' },
      { n: '03', name: 'Zarcillo', sci: 'Larosterna inca', img: A.zarcillo, tint: '#EADFCB', pw: 141, ph: 188, ratio: '3:4' },
      { n: '04', name: 'Piquero peruano', sci: 'Sula variegata', img: A.piquero, tint: '#D2E4EC', pw: 188, ph: 188, ratio: '1:1' },
      { n: '05', name: 'Gaviota peruana', sci: 'Larus belcheri', img: A.gaviota, tint: '#D2E4EC', pw: 228, ph: 128, ratio: '16:9' },
      { n: '06', name: 'Ostrero negruzco', sci: 'Haematopus ater', img: A.ostrero, tint: '#EADFCB', pw: 150, ph: 188, ratio: '4:5' },
      { n: '07', name: 'Gaviotín peruano', sci: 'Sternula lorata', img: A.gaviotin, tint: '#EADFCB', pw: 125, ph: 188, ratio: '2:3' },
      { n: '08', name: 'Playero blanco', sci: 'Calidris alba', img: A.playero, tint: '#D2E4EC', pw: 228, ph: 182, ratio: '5:4' }
    ];
    const fotos = this.props.variant === 'fotos';
    return {
      species: species.map(function (s) { return Object.assign({}, s, { ilus: !fotos, fotos: fotos }); }),
      isIlustrado: !fotos,
      isFotos: fotos,
      credit: fotos ? 'Fotografías: [Nombre del coleccionista] · completas, sin recortes' : 'Ilustraciones: [Créditos del ilustrador]'
    };
  }
}
</script>
</body>
</html>
