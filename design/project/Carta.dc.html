      marcoImg: B + 'f1c6efd6afca6996cd92742a79b70999', placa: 'rgba(12,34,52,0.84)', placaSombra: '0 0 0 1px rgba(214,238,250,0.45)', filete: '#E4F2F9',
      tx: '#FFFFFF', tx2: '#E4F2F9', linea: 'rgba(255,255,255,0.36)',
      tinte: 'linear-gradient(180deg, rgba(181,210,226,0.3), rgba(22,50,74,0.06) 55%, rgba(22,50,74,0.36))', relieveOp: 1, banda: BANDA_ARCOIRIS, luz: LUZ, luzOp: 0.6, fuera: 140,
      chispas: [chispa(24, 76, 20), chispa(262, 128, 12), chispa(260, 170, 22), chispa(30, 190, 14), chispa(150, 66, 9), chispa(228, 222, 9)],
      aveX: 50, aveY: 54, aveS: 200, aveSombra: 'drop-shadow(0 0 12px rgba(214,238,250,0.9)) drop-shadow(0 6px 10px rgba(10,30,46,0.45))',
      sombra: '0 1px 2px rgba(20,48,47,0.4), 0 12px 32px rgba(44,106,134,0.6)'
    });
  }
  return base;
};

class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { modo: 'reposo', dur: 0, x: 0.5, y: 0.5 };
  }

  componentDidMount() {
    this.calma = typeof matchMedia === 'function' && matchMedia('(prefers-reduced-motion: reduce)').matches;
    // Empieza en un momento distinto en cada carta para que una fila no destelle a la vez.
    this.programar(600 + Math.random() * 2400);
  }

  componentDidUpdate(antes) {
    if (this.props.destello && antes.destello !== this.props.destello) this.barrer(BARRIDO, 650);
  }

  componentWillUnmount() {
    [this.reloj, this.inicio, this.fin].forEach(clearTimeout);
  }

  programar(ms) {
    clearTimeout(this.reloj);
    this.reloj = setTimeout(() => {
      const espera = ESPERA[this.props.acabado ?? 'oro'];
      if (espera && !this.calma && this.state.modo === 'reposo') this.barrer(BARRIDO, 0);
      this.programar(espera ?? 6000);
    }, ms);
  }

  barrer(dur, demora = 0) {
    clearTimeout(this.inicio);
    clearTimeout(this.fin);
    this.inicio = setTimeout(() => {
      this.setState({ modo: 'barrido', dur });
      this.fin = setTimeout(() => this.setState({ modo: 'reposo', dur: 0 }), dur + 40);
    }, demora);
  }

  renderVals() {
    const size = Number(this.props.size ?? 300) || 300;
    const ave = AVES[this.props.ave] ?? AVES.pelicano;
    const id = this.props.acabado ?? 'oro';
    const hab = HABITAT[ave.hab];
    const estilo = acabadoDe(id, hab);
    const { modo, dur, x, y } = this.state;
    const brilla = ESPERA[id] !== undefined;
    const puntero = brilla && modo === 'puntero';
    const activa = puntero || (brilla && modo === 'barrido');
    const inclina = puntero && this.props.quieta !== true && this.props.quieta !== 'true';
    // El centro de la franja de luz cae en 125 − 1,5 × posición (en % de la carta).
    const lejos = modo === 'barrido' ? 100 - estilo.fuera : estilo.fuera;
    return Object.assign({}, ave, estilo, {
      w: size,
      h: Math.round(size * 420 / 300),
      scale: size / 300,
      bx: puntero ? (125 - x * 100) / 1.5 : lejos,
      by: puntero ? (125 - y * 100) / 1.5 : lejos,
      // El arcoíris recorre un ciclo entero (150 % en una imagen de 300 %), así vuelve al inicio sin salto.
      fx: puntero ? (125 - x * 100) / 1.5 : modo === 'barrido' ? -25 : 125,
      fy: puntero ? (125 - y * 100) / 1.5 : modo === 'barrido' ? -25 : 125,
      px: Math.round(x * 100),
      py: Math.round(y * 100),
      movimiento: `background-position ${dur}ms cubic-bezier(0.45, 0.05, 0.55, 0.95)`,
      resplandor: puntero ? 1 : 0,
      chispaOp: activa ? 1 : 0.5,
      chispaEsc: activa ? 1.25 : 0.6,
      rx: inclina ? Math.round((0.5 - y) * 12) : 0,
      ry: inclina ? Math.round((x - 0.5) * 14) : 0,
      mover: (e) => {
        if (!brilla) return;
        clearTimeout(this.inicio);
        clearTimeout(this.fin);
        const caja = e.currentTarget.getBoundingClientRect();
        this.setState({ modo: 'puntero', dur: 110, x: (e.clientX - caja.left) / caja.width, y: (e.clientY - caja.top) / caja.height });
      },
      soltar: () => {
        if (this.state.modo === 'puntero') this.barrer(550);
      },
      sellosCarta: ave.sellos.map((sello) => SELLOS[sello]),
      sello: ave.sellos.map((sello) => SELLOS[sello].nombre).join(' · '),
      habitat: hab.nombre,
      habOscuro: hab.oscuro,
      icono: hab.icono,
      escena: hab.escena,
      escenaPos: hab.pos,
      escalon: 'M0 5' + 'h6v-3h6v3'.repeat(22),
      obs: Number(this.props.obs ?? OBS[id] ?? 1),
      marca: MARCA[id] ?? '',
      datos: [{ k: 'Dieta', v: ave.dieta }, { k: 'Hábitat', v: hab.nombre }, { k: 'Estado', v: ave.estado }]
    });
  }
}
</script>
