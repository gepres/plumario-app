<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Buenas prácticas de observación</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&amp;family=Instrument+Sans:wght@400..700&amp;family=Instrument+Serif:ital@0;1&amp;display=swap">
<style>
body{margin:0}
a{color:#14302F}a:hover{color:#2C6A86}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; box-sizing: border-box; overflow: hidden; background: #F3EDE2; color: #14302F; font-family: 'Instrument Sans', 'Segoe UI', system-ui, sans-serif; display: flex; flex-direction: column">

<header style="flex: none; display: flex; align-items: center; gap: 4px; height: 56px; padding: 0 8px">
<a href="Perfil.dc.html" aria-label="Volver" style="width: 44px; height: 44px; border-radius: 12px; display: flex; align-items: center; justify-content: center; color: #14302F">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg>
</a>
<h1 style="margin: 0; font-family: 'Bricolage Grotesque', 'Avenir Next', system-ui, sans-serif; font-size: 20px; font-weight: 700">Buenas prácticas</h1>
</header>

<section aria-label="Idea principal" style="flex: none; margin: 0 16px; padding: 14px 16px; border-radius: 20px; background: #14302F; color: #F3EDE2; display: flex; align-items: center; gap: 14px">
<div style="flex: none; transform: rotate(-6deg)"><dc-import name="StickerAve" img="/_blob/92d0b07d7a6b9d699e834111a098ce4a" nombre="" num="038" tint="#D2E4EC" acabado="normal" size="56" hint-size="56px,72px"></dc-import></div>
<span style="display: flex; flex-direction: column; gap: 4px">
<span style="font-family: 'Bricolage Grotesque', 'Avenir Next', system-ui, sans-serif; font-size: 19px; font-weight: 800; line-height: 1.15">Ninguna foto vale más que el ave</span>
<span style="font-size: 13px; line-height: 1.4; color: #C9D8D4">Si el ave deja de hacer lo que hacía por tu culpa, estás muy cerca.</span>
</span>
</section>

<ol style="flex: none; margin: 12px 16px 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 6px">
<sc-for list="{{practicas}}" as="p" hint-placeholder-count="6">
<li style="padding: 10px 12px; background: #FBF8F2; border: 1px solid #E3DACA; border-radius: 16px; display: flex; align-items: flex-start; gap: 12px">
<span aria-hidden="true" style="flex: none; width: 36px; height: 36px; border-radius: 11px; background: {{p.bg}}; display: flex; align-items: center; justify-content: center"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#14302F" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="{{p.icon}}"></path></svg></span>
<span style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 14.5px; font-weight: 700">{{p.t}}</span><span style="font-size: 12.5px; line-height: 1.4; color: #4E5E5C">{{p.d}}</span></span>
</li>
</sc-for>
</ol>

<section aria-label="Ave en problemas" style="flex: none; margin: 12px 16px 0; padding: 12px 14px; border-radius: 16px; border: 1.5px dashed #B9AE99; display: flex; gap: 10px; align-items: flex-start">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#8A4F12" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none; margin-top: 1px"><path d="M12 3l9.5 17h-19z"></path><path d="M12 10v4M12 17h.01"></path></svg>
<span style="font-size: 13px; line-height: 1.45; color: #3F504E"><b style="color: #14302F">¿Un ave herida o atrapada?</b> No la toques ni la alimentes. Avisa a SERFOR o a la autoridad local y, si puedes, quédate cerca sin acercarte.</span>
</section>

</div>
</x-dc>

  }
}
</script>
</body>
</html>
