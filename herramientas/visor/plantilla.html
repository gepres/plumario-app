<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Plumario · visor del diseño</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Instrument+Sans:wght@400..700&display=swap">
<style>
/* Tokens de la Guía UI · fundamentos (diseno/project/GuiaFundamentos.dc.html) */
:root {
  --tinta: #14302F;
  --papel: #F3EDE2;
  --tarjeta: #FBF8F2;
  --arena: #ECE5D7;
  --segmento: #E7DFCF;
  --linea: #E3DACA;
  --borde: #D9CFBC;
  --texto-2: #4E5E5C;
  --texto-3: #3F504E;
  --oceano: #2C6A86;
  --sello: #E4C766;
  --fondo-visor: #0F2423;
  --display: 'Bricolage Grotesque', 'Avenir Next', system-ui, sans-serif;
  --cuerpo: 'Instrument Sans', 'Segoe UI', system-ui, sans-serif;
  --sombra-tarjeta: 0 1px 2px rgba(20,48,47,0.2), 0 4px 10px rgba(20,48,47,0.08);
  --sombra-flotante: 0 10px 22px rgba(20,48,47,0.13), 0 1px 2px rgba(20,48,47,0.08);
  color-scheme: light;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--papel); color: var(--tinta); font-family: var(--cuerpo); -webkit-font-smoothing: antialiased; }
button { font: inherit; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }

/* Encabezado */
.barra { position: sticky; top: 0; z-index: 10; display: flex; flex-wrap: wrap; align-items: center; gap: 12px 20px; padding: 14px 32px; background: rgba(243,237,226,0.94); backdrop-filter: blur(8px); border-bottom: 1px solid var(--linea); }
.marca { flex: 1 1 300px; min-width: 0; }
.marca h1 { margin: 0; font-family: var(--display); font-size: 22px; font-weight: 800; letter-spacing: -0.02em; line-height: 1.15; }
.marca p { margin: 2px 0 0; font-size: 13px; color: var(--texto-2); }
.marca a { color: var(--oceano); font-weight: 700; }
.segmento { display: flex; gap: 4px; padding: 4px; background: var(--segmento); border-radius: 14px; }
.segmento button { min-height: 44px; padding: 0 14px; border: 0; border-radius: 10px; background: transparent; font-size: 13.5px; font-weight: 600; color: var(--texto-3); cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
.segmento button[aria-pressed="true"] { background: var(--tarjeta); color: var(--tinta); font-weight: 700; box-shadow: 0 1px 2px rgba(20,48,47,0.14); }
.segmento button:focus-visible, .item:focus-visible { outline: 3px solid var(--oceano); outline-offset: 2px; }
.herramientas { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 16px; }
.buscar { position: relative; display: block; }
.buscar svg { position: absolute; left: 13px; top: 13px; pointer-events: none; }
.buscar input { width: 220px; height: 44px; border-radius: 12px; border: 1px solid var(--borde); background: var(--tarjeta); padding: 0 14px 0 38px; font: 15px var(--cuerpo); color: var(--tinta); }
.buscar input::placeholder { color: #5F5B54; }
.tam { display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 600; color: var(--texto-3); }
.tam input { width: 110px; accent-color: var(--tinta); }

/* Galería */
main { padding: 4px 32px 72px; }
.seccion { padding-top: 32px; }
.seccion h2 { margin: 0; font-family: var(--display); font-size: 24px; font-weight: 800; letter-spacing: -0.01em; line-height: 1.15; }
.seccion .cuenta { margin: 4px 0 18px; font-size: 13px; color: var(--texto-2); }
.fila { display: flex; flex-wrap: wrap; align-items: flex-start; gap: 28px 24px; }
.tarjeta { display: flex; flex-direction: column; gap: 10px; min-width: 150px; padding: 0; border: 0; background: none; color: inherit; text-align: left; cursor: pointer; border-radius: 12px; }
.tarjeta:focus-visible { outline: 3px solid var(--oceano); outline-offset: 6px; }
.mini { position: relative; overflow: hidden; border-radius: 10px; background: var(--arena); box-shadow: var(--sombra-tarjeta); transition: transform 0.15s ease, box-shadow 0.15s ease; }
.tarjeta:hover .mini { transform: translateY(-2px); box-shadow: var(--sombra-flotante); }
.mini iframe { position: absolute; left: 0; top: 0; border: 0; transform-origin: 0 0; pointer-events: none; }
.mini.recortada::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 48px; background: linear-gradient(rgba(20,48,47,0), rgba(20,48,47,0.16)); pointer-events: none; }
.pie { display: flex; flex-direction: column; gap: 3px; }
.pie b { font-size: 14px; font-weight: 700; line-height: 1.25; }
.pie span { display: flex; flex-wrap: wrap; align-items: center; gap: 2px 10px; font-size: 12.5px; color: var(--texto-2); }
.etiqueta { display: inline-flex; align-items: center; gap: 4px; font-weight: 700; color: var(--oceano); }
.vacio { padding: 48px 0; font-size: 15px; color: var(--texto-2); }

/* Índice: la lista a la izquierda y la pantalla al centro del resto */
.cuerpo { display: contents; }
.indice { display: none; }
.indice h2 { margin: 18px 8px 6px; font-family: var(--display); font-size: 15px; font-weight: 700; line-height: 1.25; }
.indice h2 span { font-family: var(--cuerpo); font-size: 12.5px; font-weight: 600; color: var(--texto-2); }
.indice ol { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 2px; }
.item { width: 100%; min-height: 48px; padding: 6px 10px; border: 0; border-radius: 12px; background: transparent; color: var(--tinta); text-align: left; cursor: pointer; display: grid; grid-template-columns: 28px minmax(0, 1fr); align-items: center; column-gap: 8px; }
.item:hover { background: var(--arena); }
.item .num { font-size: 12px; font-weight: 700; color: var(--texto-2); font-variant-numeric: tabular-nums; text-align: right; }
.item b { display: block; font-size: 14px; font-weight: 700; line-height: 1.25; }
.item small { display: block; font-size: 12px; color: var(--texto-2); }
.item[aria-current="true"] { background: var(--tinta); color: var(--papel); }
.item[aria-current="true"] .num, .item[aria-current="true"] small { color: #C9D8D4; }
.item[aria-current="true"] .etiqueta { color: var(--sello); }

body.vista-indice { height: 100vh; height: 100dvh; display: flex; flex-direction: column; overflow: hidden; }
body.vista-indice .barra { position: relative; }
body.vista-indice .tam { display: none; }
body.vista-indice .cuerpo { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(260px, 360px) minmax(0, 1fr); }
body.vista-indice .indice { display: block; min-height: 0; overflow-y: auto; padding: 0 12px 32px; border-right: 1px solid var(--linea); }
body.vista-indice #secciones { display: none; }
body.vista-indice .visor { position: relative; inset: auto; z-index: auto; min-width: 0; min-height: 0; }
body.vista-indice #v-cerrar { display: none; }

/* Pantalla abierta: superpuesta en la galería, acoplada en el índice */
.visor { position: fixed; inset: 0; z-index: 50; display: flex; flex-direction: column; background: var(--fondo-visor); }
.visor[hidden] { display: none; }
.visor-barra { flex: none; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; padding: 10px 16px; color: var(--papel); border-bottom: 1px solid rgba(243,237,226,0.12); }
.visor-barra button { min-width: 44px; min-height: 44px; padding: 0 12px; border-radius: 12px; border: 1px solid rgba(243,237,226,0.24); background: transparent; color: var(--papel); font-size: 14px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center; gap: 6px; cursor: pointer; }
.visor-barra button:hover:not(:disabled) { background: rgba(243,237,226,0.08); }
.visor-barra button:disabled { opacity: 0.4; cursor: default; }
.visor-barra button[aria-pressed="true"] { background: var(--sello); border-color: var(--sello); color: var(--tinta); }
.visor-barra button:focus-visible { outline: 3px solid var(--sello); outline-offset: 2px; }
.visor-info { flex: 1 1 200px; min-width: 0; }
.visor-info span { display: block; font-size: 12px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--sello); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.visor-info h2 { margin: 0; font-family: var(--display); font-size: 19px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.visor-acciones { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.posicion { min-width: 64px; text-align: center; font-size: 13px; font-weight: 600; color: #C9D8D4; }
.escenario { flex: 1; min-height: 0; overflow: auto; display: flex; padding: 24px; }
.marco { position: relative; flex: none; margin: auto; overflow: hidden; border-radius: 12px; background: #FFFFFF; box-shadow: 0 24px 60px rgba(0,0,0,0.45); }
.marco iframe { position: absolute; left: 0; top: 0; border: 0; transform-origin: 0 0; }
.aviso { position: fixed; left: 50%; bottom: 24px; z-index: 60; transform: translateX(-50%); max-width: calc(100vw - 32px); padding: 12px 18px; border-radius: 12px; background: var(--tinta); color: var(--papel); font-size: 14px; box-shadow: var(--sombra-flotante); }
.aviso[hidden] { display: none; }

@media (max-width: 760px) {
  .barra { padding: 12px 16px; }
  main { padding: 4px 16px 56px; }
  .buscar, .buscar input { width: 100%; }
  .herramientas { width: 100%; }
  .tam { display: none; }
  .escenario { padding: 12px; }
  body.vista-indice .barra { gap: 8px; padding: 10px 12px; }
  body.vista-indice .marca h1 { font-size: 17px; }
  body.vista-indice .marca p { display: none; }
  body.vista-indice .cuerpo { grid-template-columns: minmax(0, 1fr); grid-template-rows: minmax(0, 1fr) minmax(0, 2fr); }
  body.vista-indice .indice { border-right: 0; border-bottom: 1px solid var(--linea); }
  body.vista-indice .visor-barra { gap: 6px; padding: 6px 8px; }
  body.vista-indice .visor-info span, body.vista-indice #v-reiniciar, body.vista-indice #v-real { display: none; }
  body.vista-indice .visor-info h2 { font-size: 16px; }
}
</style>
</head>
<body>

<header class="barra">
  <div class="marca">
    <h1 id="titulo"></h1>
    <p id="resumen"></p>
  </div>
  <nav class="segmento" id="vistas" aria-label="Vista">
    <button type="button" data-vista="galeria"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="4" width="7" height="7" rx="1.5"></rect><rect x="13" y="4" width="7" height="7" rx="1.5"></rect><rect x="4" y="13" width="7" height="7" rx="1.5"></rect><rect x="13" y="13" width="7" height="7" rx="1.5"></rect></svg>Galería</button>
    <button type="button" data-vista="indice"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6h11M9 12h11M9 18h11M4.5 6h.01M4.5 12h.01M4.5 18h.01"></path></svg>Índice</button>
  </nav>
  <nav class="segmento" id="paginas" aria-label="Páginas del canvas"></nav>
  <div class="herramientas">
    <label class="buscar">
      <span class="sr">Buscar pantalla</span>
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#4E5E5C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="6.5"></circle><path d="M16 16l4.5 4.5"></path></svg>
      <input id="buscar" type="search" placeholder="Buscar pantalla" autocomplete="off">
    </label>
    <label class="tam">Tamaño <input id="tam" type="range" min="200" max="560" step="20" value="320"></label>
  </div>
</header>

<div class="cuerpo">
  <nav class="indice" id="indice" aria-label="Índice de pantallas"></nav>

  <main id="secciones"></main>

  <div class="visor" id="visor" role="dialog" aria-modal="true" aria-labelledby="visor-titulo" hidden>
    <div class="visor-barra">
      <button type="button" id="v-cerrar" aria-label="Cerrar y volver a la galería"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></button>
      <button type="button" id="v-volver" aria-label="Volver a la pantalla anterior"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg>Volver</button>
      <div class="visor-info">
        <span id="visor-seccion"></span>
        <h2 id="visor-titulo"></h2>
      </div>
      <div class="visor-acciones">
        <button type="button" id="v-reiniciar">Reiniciar</button>
        <button type="button" id="v-real" aria-pressed="false">Tamaño real</button>
        <button type="button" id="v-anterior" aria-label="Pantalla anterior"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></button>
        <span class="posicion" id="v-posicion"></span>
        <button type="button" id="v-siguiente" aria-label="Pantalla siguiente"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"></path></svg></button>
      </div>
    </div>
    <div class="escenario" id="escenario"><div class="marco" id="marco"></div></div>
  </div>
</div>

<div class="aviso" id="aviso" role="status" hidden></div>

<script id="datos" type="application/json">/*__DATOS__*/</script>
<script>
(() => {
  'use strict';

  const { origen, canvas, archivos, runtime } = JSON.parse(document.getElementById('datos').textContent);

  // ---- Cada artboard en su iframe ----
  // Se pinta con el runtime real del formato .dc.html. El iframe es autónomo: lleva dentro el
  // runtime y los .dc.html que usa (el suyo y sus <dc-import>), y avisa al visor por postMessage.
  // Así no depende de poder leer la página principal, que algunos navegadores bloquean en file://.

  function arranque() {
    var datos = JSON.parse(document.getElementById('__visor').textContent);
    var avisar = function (mensaje) {
      mensaje.__visor = true;
      try { parent.postMessage(mensaje, '*'); } catch (e) {}
    };
    var fetchOriginal = window.fetch.bind(window);
    window.fetch = function (recurso, opciones) {
      var url = String(recurso && recurso.url ? recurso.url : recurso);
      var nombre = url === location.href ? datos.archivo : decodeURIComponent(url.split('#')[0].split('?')[0].split('/').pop());
      var texto = datos.archivos[nombre];
      if (texto != null) return Promise.resolve(new Response(texto, { status: 200, headers: { 'Content-Type': 'text/html; charset=utf-8' } }));
      return fetchOriginal(recurso, opciones);
    };
    document.addEventListener('click', function (e) {
      var a = e.target.closest && e.target.closest('a[href]');
      if (!a) return;
      var href = a.getAttribute('href') || '';
      e.preventDefault();
      if (/^https?:/i.test(href)) { window.open(href, '_blank', 'noopener'); return; }
      if (href.charAt(0) === '#') {
        var destino = href.length > 1 && document.getElementById(href.slice(1));
        if (destino) destino.scrollIntoView({ behavior: 'smooth' });
        return;
      }
      avisar({ tipo: 'navegar', href: href });
    }, true);
    document.addEventListener('submit', function (e) { e.preventDefault(); }, true);
    document.addEventListener('keydown', function (e) { if (e.key === 'Escape') avisar({ tipo: 'tecla', tecla: e.key }); });
    (new Function(datos.runtime))();
  }

  function dependencias(archivo, vistos = new Set()) {
    if (vistos.has(archivo) || !(archivo in archivos)) return vistos;
    vistos.add(archivo);
    for (const m of archivos[archivo].matchAll(/<dc-import\b[^>]*\sname="([^"{}]+)"/g)) dependencias(m[1] + '.dc.html', vistos);
    return vistos;
  }

  // El <x-dc> va vacío: si el navegador parseara la plantilla cruda pediría src="{{img}}" y
  // avisaría de cada d="{{icono}}". El runtime la toma entera del fetch(location.href).
  function documentoDe(archivo) {
    const paquete = { archivo, runtime, archivos: Object.fromEntries([...dependencias(archivo)].map((f) => [f, archivos[f]])) };
    const inyeccion = '<script type="application/json" id="__visor">' + JSON.stringify(paquete).replace(/</g, '\\u003c') + '<\/script>' +
      '<script>(' + arranque.toString() + ')();<\/script>';
    const fuente = archivos[archivo].replace(/<script\s+src=["']\.\/support\.js["']\s*><\/script>/i, () => inyeccion);
    const apertura = /<x-dc(\s[^>]*)?>/.exec(fuente);
    const cierre = fuente.lastIndexOf('</x-dc>');
    if (!apertura || cierre < apertura.index) return fuente;
    return fuente.slice(0, apertura.index + apertura[0].length) + fuente.slice(cierre);
  }

  // ---- Modelo: páginas, secciones (los títulos del canvas) y artboards ----

  const PAGINAS = canvas.pages && canvas.pages.length ? canvas.pages : [{ id: 'canvas', name: 'Canvas' }];
  const paginaDe = (o) => o.page || PAGINAS[0].id;
  const sinExtension = (f) => f.replace(/\.dc\.html$/, '');

  const titulos = Object.entries(canvas.notes || {})
    .filter(([, n]) => n.kind === 'title1')
    .map(([id, n]) => ({ id, texto: n.text, x: n.x, y: n.y, ancho: n.maxW || Infinity, pagina: paginaDe(n) }));

  // Un artboard pertenece al título más cercano por encima de él cuya franja horizontal lo cubre.
  function tituloDe(t) {
    let mejor = null;
    for (const n of titulos) {
      if (n.pagina !== t.pagina || n.y > t.y || t.x < n.x - 40 || t.x >= n.x + n.ancho) continue;
      if (!mejor || n.y > mejor.y || (n.y === mejor.y && n.x > mejor.x)) mejor = n;
    }
    return mejor;
  }

  const nombres = [...new Set([...(canvas.order || []), ...Object.keys(canvas.boards)])].filter((f) => canvas.boards[f]);
  const tableros = nombres.map((archivo) => {
    const b = canvas.boards[archivo];
    return { archivo, titulo: b.title || sinExtension(archivo), x: b.x, y: b.y, w: b.w, h: b.h, interactiva: !!b.is_interactive, pagina: paginaDe(b) };
  });
  const porArchivo = new Map(tableros.map((t) => [t.archivo, t]));

  const seccionesPorPagina = new Map(PAGINAS.map((p) => [p.id, []]));
  for (const p of PAGINAS) {
    const grupos = new Map();
    for (const t of tableros.filter((t) => t.pagina === p.id)) {
      const n = tituloDe(t);
      const clave = n ? n.id : '_sin';
      if (!grupos.has(clave)) grupos.set(clave, { id: clave, titulo: n ? n.texto : 'Sin sección', x: n ? n.x : 0, y: n ? n.y : Infinity, tableros: [] });
      grupos.get(clave).tableros.push(t);
      t.seccion = n ? n.texto : 'Sin sección';
    }
    const secciones = [...grupos.values()].sort((a, b) => a.y - b.y || a.x - b.x);
    for (const s of secciones) s.tableros.sort((a, b) => a.y - b.y || a.x - b.x);
    seccionesPorPagina.set(p.id, secciones);
  }
  const ordenPorPagina = new Map(PAGINAS.map((p) => [p.id, seccionesPorPagina.get(p.id).flatMap((s) => s.tableros)]));
  for (const lista of ordenPorPagina.values()) lista.forEach((t, i) => { t.numero = i + 1; });

  // ---- Estado y utilidades ----

  const leer = (k, d) => { try { return localStorage.getItem(k) ?? d; } catch { return d; } };
  const guardar = (k, v) => { try { localStorage.setItem(k, v); } catch {} };

  const estado = {
    vista: leer('visor.vista', 'galeria') === 'indice' ? 'indice' : 'galeria',
    pagina: PAGINAS[0].id,
    filtro: '',
    tam: Number(leer('visor.tam', 320)) || 320,
    real: leer('visor.real', '0') === '1'
  };
  const visor = { actual: null, historial: [], origenFoco: null };
  const enIndice = () => estado.vista === 'indice';

  const $ = (id) => document.getElementById(id);
  function el(tag, attrs, ...hijos) {
    const n = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs || {})) {
      if (v == null || v === false) continue;
      if (k === 'texto') n.textContent = v;
      else if (k.startsWith('on')) n.addEventListener(k.slice(2), v);
      else n.setAttribute(k, v === true ? '' : v);
    }
    n.append(...hijos.filter((h) => h != null));
    return n;
  }
  const normalizar = (s) => s.normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();

  let temporizadorAviso = 0;
  function avisar(texto) {
    const a = $('aviso');
    a.textContent = texto;
    a.hidden = false;
    clearTimeout(temporizadorAviso);
    temporizadorAviso = setTimeout(() => { a.hidden = true; }, 3200);
  }

  function coincide(t) {
    if (!estado.filtro) return true;
    const q = normalizar(estado.filtro);
    return normalizar(t.titulo).includes(q) || normalizar(t.archivo).includes(q) || normalizar(t.seccion).includes(q);
  }
  const seccionesVisibles = () => seccionesPorPagina.get(estado.pagina)
    .map((s) => ({ ...s, tableros: s.tableros.filter(coincide) }))
    .filter((s) => s.tableros.length);
  const cuenta = (n) => (n === 1 ? '1 pantalla' : n + ' pantallas');

  // ---- Galería ----

  // Las pantallas muy altas se muestran recortadas a proporción de teléfono; el visor las enseña enteras.
  const altoVisible = (t) => Math.min(t.h, t.w * 2.2);
  function anchoDisponible() {
    const main = $('secciones');
    const css = getComputedStyle(main);
    return main.clientWidth - parseFloat(css.paddingLeft) - parseFloat(css.paddingRight);
  }
  const escalaMini = (t) => Math.min(estado.tam / altoVisible(t), Math.min(estado.tam * 1.75, anchoDisponible()) / t.w, 1);

  function medirMini(caja, t) {
    const s = escalaMini(t);
    const ancho = Math.round(t.w * s);
    caja.style.width = ancho + 'px';
    caja.style.height = Math.round(altoVisible(t) * s) + 'px';
    caja.parentElement.style.width = Math.max(ancho, 150) + 'px';
    const f = caja.querySelector('iframe');
    if (f) f.style.transform = 'scale(' + s + ')';
  }
  const medirTodas = () => { for (const caja of document.querySelectorAll('.mini')) medirMini(caja, porArchivo.get(caja.dataset.archivo)); };

  function montarMini(caja) {
    if (caja.querySelector('iframe')) return;
    const t = porArchivo.get(caja.dataset.archivo);
    const f = el('iframe', { title: t.titulo, tabindex: '-1', 'aria-hidden': 'true' });
    f.style.width = t.w + 'px';
    f.style.height = t.h + 'px';
    f.style.transform = 'scale(' + escalaMini(t) + ')';
    f.srcdoc = documentoDe(t.archivo);
    caja.append(f);
  }

  // Cada miniatura es un React vivo: se monta al acercarse a la vista y se desmonta al alejarse.
  const cerca = new IntersectionObserver((entradas) => {
    for (const e of entradas) if (e.isIntersecting) montarMini(e.target);
  }, { rootMargin: '600px 0px' });
  const lejos = new IntersectionObserver((entradas) => {
    for (const e of entradas) if (!e.isIntersecting) e.target.querySelector('iframe')?.remove();
  }, { rootMargin: '2400px 0px' });

  function tarjeta(t) {
    const caja = el('div', { class: 'mini' + (t.h > altoVisible(t) ? ' recortada' : ''), inert: true });
    caja.dataset.archivo = t.archivo;
    const meta = el('span', null,
      el('span', { texto: sinExtension(t.archivo) }),
      el('span', { texto: t.w + ' × ' + t.h }),
      t.interactiva ? el('span', { class: 'etiqueta', texto: 'Interactiva' }) : null
    );
    const boton = el('button', { type: 'button', class: 'tarjeta', 'aria-label': 'Abrir ' + t.titulo, onclick: () => abrir(t.archivo, { desde: boton }) },
      caja,
      el('span', { class: 'pie' }, el('b', { texto: t.titulo }), meta)
    );
    return boton;
  }

  function vaciarGaleria() {
    cerca.disconnect();
    lejos.disconnect();
    $('secciones').replaceChildren();
  }

  function pintarGaleria() {
    vaciarGaleria();
    const main = $('secciones');
    const secciones = seccionesVisibles();
    for (const s of secciones) {
      main.append(el('section', { class: 'seccion', 'aria-label': s.titulo },
        el('h2', { texto: s.titulo }),
        el('p', { class: 'cuenta', texto: cuenta(s.tableros.length) }),
        el('div', { class: 'fila' }, ...s.tableros.map(tarjeta))
      ));
    }
    if (!secciones.length) main.append(el('p', { class: 'vacio', texto: 'Ninguna pantalla coincide con «' + estado.filtro + '».' }));
    for (const caja of main.querySelectorAll('.mini')) {
      medirMini(caja, porArchivo.get(caja.dataset.archivo));
      cerca.observe(caja);
      lejos.observe(caja);
    }
  }

  // ---- Índice ----

  function pintarIndice() {
    const nav = $('indice');
    const secciones = seccionesVisibles();
    nav.replaceChildren(...secciones.map((s) => el('section', { 'aria-label': s.titulo },
      el('h2', null, s.titulo + ' ', el('span', { texto: '· ' + s.tableros.length })),
      el('ol', null, ...s.tableros.map((t) => el('li', null,
        el('button', { type: 'button', class: 'item', 'data-archivo': t.archivo, 'aria-current': String(t.archivo === visor.actual), onclick: () => abrir(t.archivo, { reiniciarHistorial: true }) },
          el('span', { class: 'num', texto: String(t.numero) }),
          el('span', null,
            el('b', { texto: t.titulo }),
            el('small', null, sinExtension(t.archivo) + ' · ' + t.w + ' × ' + t.h, t.interactiva ? ' · ' : null, t.interactiva ? el('span', { class: 'etiqueta', texto: 'Interactiva' }) : null)
          )
        )
      )))
    )));
    if (!secciones.length) nav.append(el('p', { class: 'vacio', texto: 'Ninguna pantalla coincide con «' + estado.filtro + '».' }));
  }

  function marcarIndice() {
    if (!enIndice()) return;
    for (const b of $('indice').querySelectorAll('.item')) {
      const activo = b.dataset.archivo === visor.actual;
      b.setAttribute('aria-current', String(activo));
      if (activo) b.scrollIntoView({ block: 'nearest' });
    }
  }

  // ---- Pantalla abierta ----

  function listaDe(t) {
    const pagina = ordenPorPagina.get(t.pagina);
    const filtrada = pagina.filter(coincide);
    return filtrada.includes(t) ? filtrada : pagina;
  }

  function abrir(archivo, opciones) {
    const { desde = null, empujar = true, reiniciarHistorial = false } = opciones || {};
    const t = porArchivo.get(archivo);
    if (!t || !(archivo in archivos)) { avisar('La pantalla «' + archivo + '» no está en el canvas.'); return; }
    const v = $('visor');
    const estabaOculto = v.hidden;
    if (estabaOculto) visor.origenFoco = desde || document.activeElement;
    if (estabaOculto || reiniciarHistorial) visor.historial = [];
    else if (empujar && visor.actual && visor.actual !== archivo) visor.historial.push(visor.actual);
    visor.actual = archivo;
    $('visor-titulo').textContent = t.titulo;
    $('visor-seccion').textContent = (PAGINAS.find((p) => p.id === t.pagina)?.name || '') + ' · ' + t.seccion;
    $('v-volver').disabled = !visor.historial.length;
    const lista = listaDe(t);
    const i = lista.indexOf(t);
    $('v-anterior').disabled = i <= 0;
    $('v-siguiente').disabled = i >= lista.length - 1;
    $('v-posicion').textContent = (i + 1) + ' de ' + lista.length;
    // Visible antes de cargar: la escala se calcula con el tamaño del escenario.
    if (estabaOculto) {
      v.hidden = false;
      if (!enIndice()) document.body.style.overflow = 'hidden';
    }
    cargarMarco();
    if (estabaOculto && !enIndice()) $('v-cerrar').focus();
    marcarIndice();
    escribirHash();
  }

  function cargarMarco() {
    const t = porArchivo.get(visor.actual);
    const f = el('iframe', { title: t.titulo });
    f.style.width = t.w + 'px';
    f.style.height = t.h + 'px';
    f.srcdoc = documentoDe(t.archivo);
    $('marco').replaceChildren(f);
    ajustarMarco();
    $('escenario').scrollTo(0, 0);
  }

  function ajustarMarco() {
    if (!visor.actual) return;
    const t = porArchivo.get(visor.actual);
    const esc = $('escenario');
    const libreAncho = esc.clientWidth - 48;
    const libreAlto = esc.clientHeight - 48;
    const s = estado.real ? 1 : Math.max(0.1, Math.min(libreAncho / t.w, libreAlto / altoVisible(t), 1));
    const m = $('marco');
    m.style.width = Math.round(t.w * s) + 'px';
    m.style.height = Math.round(t.h * s) + 'px';
    const f = m.querySelector('iframe');
    if (f) f.style.transform = 'scale(' + s + ')';
    $('v-real').setAttribute('aria-pressed', String(estado.real));
  }

  function cerrar() {
    const v = $('visor');
    if (v.hidden || enIndice()) return;
    v.hidden = true;
    $('marco').replaceChildren();
    visor.actual = null;
    document.body.style.overflow = '';
    escribirHash();
    visor.origenFoco?.focus?.();
  }

  function moverse(paso) {
    const t = porArchivo.get(visor.actual);
    if (!t) return;
    const lista = listaDe(t);
    const sig = lista[lista.indexOf(t) + paso];
    if (sig) abrir(sig.archivo, { empujar: false });
  }

  // Un enlace dentro de un artboard (href="Album.dc.html") abre esa pantalla en el visor.
  function navegar(href) {
    const ruta = String(href).split('#')[0].split('?')[0];
    if (ruta) abrir(decodeURIComponent(ruta.split('/').pop()));
  }

  window.addEventListener('message', (e) => {
    const d = e.data;
    if (!d || d.__visor !== true) return;
    const f = $('marco').querySelector('iframe');
    if (!f || e.source !== f.contentWindow) return; // las miniaturas no navegan
    if (d.tipo === 'navegar') navegar(d.href);
    else if (d.tipo === 'tecla' && d.tecla === 'Escape') cerrar();
  });

  // ---- Vistas y páginas ----

  function ponerVista(vista) {
    estado.vista = vista;
    guardar('visor.vista', vista);
    document.body.classList.toggle('vista-indice', vista === 'indice');
    document.body.style.overflow = '';
    for (const b of $('vistas').querySelectorAll('button')) b.setAttribute('aria-pressed', String(b.dataset.vista === vista));
    const v = $('visor');
    if (vista === 'indice') {
      vaciarGaleria();
      pintarIndice();
      const lista = ordenPorPagina.get(estado.pagina);
      const actual = porArchivo.get(visor.actual);
      const destino = actual && actual.pagina === estado.pagina ? actual : (lista.find(coincide) || lista[0]);
      v.setAttribute('aria-modal', 'false');
      v.hidden = false;
      if (destino) abrir(destino.archivo, { reiniciarHistorial: true });
    } else {
      v.setAttribute('aria-modal', 'true');
      v.hidden = true;
      $('marco').replaceChildren();
      visor.actual = null;
      $('indice').replaceChildren();
      pintarGaleria();
      escribirHash();
    }
  }

  function pintarPaginas() {
    $('paginas').replaceChildren(...PAGINAS.map((p) => el('button', {
      type: 'button',
      'aria-pressed': String(p.id === estado.pagina),
      texto: p.name + ' · ' + ordenPorPagina.get(p.id).length,
      onclick: () => {
        estado.pagina = p.id;
        pintarPaginas();
        if (enIndice()) {
          pintarIndice();
          const primero = ordenPorPagina.get(p.id).find(coincide);
          if (primero) abrir(primero.archivo, { reiniciarHistorial: true });
        } else {
          pintarGaleria();
          window.scrollTo(0, 0);
        }
        escribirHash();
      }
    })));
  }

  // ---- Enlace directo: #vista=indice&pagina=v2&ver=Main.dc.html ----

  function escribirHash() {
    const p = new URLSearchParams();
    if (enIndice()) p.set('vista', 'indice');
    p.set('pagina', estado.pagina);
    if (visor.actual) p.set('ver', visor.actual);
    history.replaceState(null, '', '#' + p.toString());
  }

  function leerHash() {
    const p = new URLSearchParams(location.hash.slice(1));
    const pagina = p.get('pagina');
    if (PAGINAS.some((x) => x.id === pagina)) estado.pagina = pagina;
    if (p.has('vista')) estado.vista = p.get('vista') === 'indice' ? 'indice' : 'galeria';
    const ver = p.get('ver');
    if (ver && porArchivo.has(ver)) estado.pagina = porArchivo.get(ver).pagina;
    return ver;
  }

  // ---- Arranque ----

  $('titulo').textContent = canvas.title || 'Diseño';
  document.title = (canvas.title || 'Diseño') + ' · visor';
  $('resumen').append(
    tableros.length + ' pantallas · ' + tableros.filter((t) => t.interactiva).length + ' interactivas · ',
    el('a', { href: origen, target: '_blank', rel: 'noopener', texto: 'Abrir el canvas en Claude Design' })
  );

  const tam = $('tam');
  tam.value = estado.tam;
  tam.addEventListener('input', () => { estado.tam = Number(tam.value); medirTodas(); });
  tam.addEventListener('change', () => guardar('visor.tam', estado.tam));

  let temporizadorBusqueda = 0;
  $('buscar').addEventListener('input', (e) => {
    clearTimeout(temporizadorBusqueda);
    temporizadorBusqueda = setTimeout(() => {
      estado.filtro = e.target.value.trim();
      if (enIndice()) { pintarIndice(); marcarIndice(); } else pintarGaleria();
    }, 160);
  });

  for (const b of $('vistas').querySelectorAll('button')) b.addEventListener('click', () => { if (b.dataset.vista !== estado.vista) ponerVista(b.dataset.vista); });
  $('v-cerrar').addEventListener('click', cerrar);
  $('v-volver').addEventListener('click', () => { const prev = visor.historial.pop(); if (prev) abrir(prev, { empujar: false }); });
  $('v-reiniciar').addEventListener('click', cargarMarco);
  $('v-real').addEventListener('click', () => { estado.real = !estado.real; guardar('visor.real', estado.real ? '1' : '0'); ajustarMarco(); });
  $('v-anterior').addEventListener('click', () => moverse(-1));
  $('v-siguiente').addEventListener('click', () => moverse(1));
  window.addEventListener('resize', () => { ajustarMarco(); medirTodas(); });
  document.addEventListener('keydown', (e) => {
    if ($('visor').hidden || e.target.tagName === 'INPUT') return;
    if (e.key === 'Escape') cerrar();
    else if (e.key === 'ArrowLeft' || (enIndice() && e.key === 'ArrowUp')) { e.preventDefault(); moverse(-1); }
    else if (e.key === 'ArrowRight' || (enIndice() && e.key === 'ArrowDown')) { e.preventDefault(); moverse(1); }
  });

  const inicial = leerHash();
  pintarPaginas();
  if (inicial) visor.actual = inicial;
  ponerVista(estado.vista);
  if (inicial && !enIndice()) abrir(inicial);
})();
</script>
</body>
</html>
