<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Trivia del día</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&amp;family=Instrument+Sans:wght@400..700&amp;family=Instrument+Serif:ital@0;1&amp;display=swap">
<style>
body{margin:0}
a{color:#14302F}a:hover{color:#2C6A86}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; box-sizing: border-box; overflow: hidden; background: #F3EDE2; color: #14302F; font-family: 'Instrument Sans', 'Segoe UI', system-ui, sans-serif; display: flex; flex-direction: column">

<header style="flex: none; display: flex; align-items: center; gap: 4px; height: 56px; padding: 0 8px">
<a href="Inicio.dc.html" aria-label="Cerrar" style="width: 44px; height: 44px; border-radius: 12px; display: flex; align-items: center; justify-content: center; color: #14302F">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg>
</a>
<h1 style="margin: 0; font-family: 'Bricolage Grotesque', 'Avenir Next', system-ui, sans-serif; font-size: 20px; font-weight: 700">Trivia del día</h1>
</header>

<sc-if value="{{jugando}}" hint-placeholder-val="{{ true }}">
<div style="flex: none; margin: 0 20px; display: flex; flex-direction: column; gap: 6px">
<span style="font-size: 13.5px; font-weight: 700">Pregunta {{numero}} de 5</span>
<div role="img" aria-label="Pregunta {{numero}} de 5" style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 4px">
<sc-for list="{{tramos}}" as="t" hint-placeholder-count="5">
<span style="height: 6px; border-radius: 3px; background: {{t.bg}}"></span>
</sc-for>
</div>
</div>

<div style="flex: none; height: 232px; margin: 16px 16px 0; border-radius: 22px; background: #E3EDF0; display: flex; align-items: center; justify-content: center">
<div style="transform: rotate(-3deg)"><dc-import name="StickerAve" img="{{pregunta.img}}" nombre="" num="?" tint="#D2E4EC" acabado="normal" size="150" hint-size="150px,192px"></dc-import></div>
</div>

<h2 style="flex: none; margin: 16px 20px 0; font-family: 'Bricolage Grotesque', 'Avenir Next', system-ui, sans-serif; font-size: 23px; font-weight: 800; letter-spacing: -0.01em; line-height: 1.15">{{pregunta.texto}}</h2>

<div role="group" aria-label="Opciones" style="flex: none; margin: 12px 16px 0; display: flex; flex-direction: column; gap: 8px">
<sc-for list="{{opciones}}" as="o" hint-placeholder-count="3">
<button disabled="{{respondida}}" onClick="{{o.pick}}" style="min-height: 52px; box-sizing: border-box; border-radius: 14px; border: {{o.borde}}; background: {{o.bg}}; color: #14302F; font-family: inherit; font-size: 15px; font-weight: 700; text-align: left; padding: 0 16px; display: flex; align-items: center; justify-content: space-between; cursor: pointer">{{o.texto}}<span style="font-size: 13px; color: {{o.marcaInk}}">{{o.marca}}</span></button>
</sc-for>
</div>

<div style="margin-top: auto; padding: 0 16px 22px; flex: none; display: flex; flex-direction: column; gap: 8px">
<sc-if value="{{respondida}}" hint-placeholder-val="{{ false }}">
<button onClick="{{seguir}}" style="min-height: 52px; border: 0; border-radius: 14px; background: #14302F; color: #FFFFFF; font-family: inherit; font-size: 15.5px; font-weight: 700; cursor: pointer">{{seguirTexto}}</button>
</sc-if>
<sc-if value="{{sinResponder}}" hint-placeholder-val="{{ true }}">
<p style="margin: 0; display: flex; align-items: center; justify-content: center; gap: 6px; font-size: 13px; color: #4E5E5C"><dc-import name="MonedaPluma" size="18" hint-size="18px,18px"></dc-import>Termina las 5 y ganas 1 pluma</p>
</sc-if>
</div>
</sc-if>

<sc-if value="{{terminada}}" hint-placeholder-val="{{ false }}">
<section role="status" style="flex: 1; min-height: 0; padding: 0 28px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; text-align: center">
<dc-import name="MonedaPluma" size="104" hint-size="104px,104px"></dc-import>
<span style="margin-top: 8px; font-size: 13px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: #2C6A86">+1 pluma</span>
<h2 style="margin: 0; font-family: 'Bricolage Grotesque', 'Avenir Next', system-ui, sans-serif; font-size: 30px; font-weight: 800; letter-spacing: -0.015em; line-height: 1.05">Acertaste {{aciertos}} de 5</h2>
<p style="margin: 0; font-size: 15px; line-height: 1.45; color: #3F504E">La pluma es por terminar. Vuelve mañana por otras 5 preguntas.</p>
</section>
<div style="padding: 0 16px 22px; flex: none">
<dc-import name="Boton" texto="Seguir explorando" variante="primario" href="Inicio.dc.html" ancho="358" hint-size="358px,52px"></dc-import>
</div>
</sc-if>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { i: 0, elegida: null, aciertos: 0 };
  }
  renderVals() {
    const B = '/_blob/';
    const PREGUNTAS = [
      { img: B + '92d0b07d7a6b9d699e834111a098ce4a', texto: '¿Qué ave es?', opciones: ['Pelícano Peruano', 'Piquero Peruano', 'Cormorán Guanay'], correcta: 0 },
      { img: B + '700e5a92d8dae9ed43cb6af87296da4a', texto: '¿Dónde la buscarías?', opciones: ['En la sierra', 'En la orilla del mar', 'En el desierto'], correcta: 1 },
      { img: B + 'cdb078ae3f20d0b791f60aa76ef64daf', texto: '¿Qué ave es?', opciones: ['Gaviota Peruana', 'Gaviotín Zarcillo', 'Gaviotín Peruano'], correcta: 1 },
      { img: B + '134f420a8833e17a10978048f13b57fd', texto: '¿Qué ave es?', opciones: ['Flamenco Chileno', 'Garcita Blanca', 'Pelícano Peruano'], correcta: 0 },
      { img: B + '5162866b42675093ef5daa43287e76d2', texto: '¿Qué rasgo tiene?', opciones: ['Patas rojas', 'Cresta amarilla', 'Collar blanco'], correcta: 2 }
    ];
    const { i, elegida, aciertos } = this.state;
    const terminada = i >= PREGUNTAS.length;
    const pregunta = PREGUNTAS[Math.min(i, PREGUNTAS.length - 1)];
    const respondida = elegida !== null;
    return {
      jugando: !terminada,
      terminada,
      numero: Math.min(i + 1, 5),
      aciertos,
      pregunta,
      respondida,
      sinResponder: !respondida,
      seguirTexto: i === PREGUNTAS.length - 1 ? 'Terminar' : 'Siguiente pregunta',
      tramos: PREGUNTAS.map((_, n) => ({ bg: n < i ? '#14302F' : n === i ? '#2C6A86' : '#E3DACA' })),
      opciones: pregunta.opciones.map((texto, n) => {
        const correcta = respondida && n === pregunta.correcta;
        const errada = respondida && n === elegida && n !== pregunta.correcta;
        return {
          texto,
          borde: correcta ? '2px solid #2D5F41' : errada ? '2px solid #A33A2B' : '1px solid #E3DACA',
          bg: correcta ? '#E3EEE6' : errada ? '#F7E4E0' : '#FBF8F2',
          marca: correcta ? 'Correcta' : errada ? 'No es' : '',
          marcaInk: correcta ? '#2D5F41' : '#A33A2B',
          pick: () => this.setState({ elegida: n, aciertos: aciertos + (n === pregunta.correcta ? 1 : 0) })
        };
      }),
      seguir: () => this.setState({ i: i + 1, elegida: null })
    };
  }
}
</script>
</body>
</html>
