packages:
  - apps/*
  - packages/*
  - functions

# node_modules plano, como npm. Expo soporta la instalación aislada desde el SDK 54, pero algunas
# librerías nativas fallan al resolver con ella y la propia guía de Expo manda volver a hoisted.
# Ya pasó en archetypes-mobile: mejor no empezar por ahí.
nodeLinker: hoisted

