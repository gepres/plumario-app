<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Lo que trajo tu sobre</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&amp;family=Instrument+Sans:wght@400..700&amp;family=Instrument+Serif:ital@0;1&amp;display=swap">
<style>
body{margin:0}
a{color:#F3EDE2}a:hover{color:#FFFFFF}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; box-sizing: border-box; overflow: hidden; background: radial-gradient(circle at 50% 34%, #24403A 0%, #0D1B18 64%); color: #FFFFFF; font-family: 'Instrument Sans', 'Segoe UI', system-ui, sans-serif; display: flex; flex-direction: column">

<div aria-hidden="true" style="position: absolute; left: -105px; top: 0; width: 600px; height: 600px; border-radius: 50%; background: radial-gradient(circle, rgba(13,27,24,0) 18%, #0D1B18 66%), repeating-conic-gradient(from 0deg, rgba(243,237,226,0) 0deg 8deg, rgba(243,237,226,0.07) 8deg 16deg)"></div>

<header style="position: relative; flex: none; height: 56px; padding: 0 8px; display: flex; align-items: center; justify-content: space-between">
<a href="Inicio.dc.html" aria-label="Cerrar" style="width: 44px; height: 44px; border-radius: 12px; display: flex; align-items: center; justify-content: center; color: #F3EDE2">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg>
</a>
<span style="font-size: 13px; font-weight: 700; color: #F3EDE2; background: rgba(243,237,226,0.12); border: 1px solid rgba(243,237,226,0.24); border-radius: 999px; padding: 6px 12px">{{etiqueta}}</span>
<span aria-hidden="true" style="width: 44px"></span>
</header>

<div style="position: relative; flex: none; height: 418px; box-sizing: border-box; padding-top: 8px; display: flex; align-items: flex-start; justify-content: center">
<div aria-hidden="true" style="position: absolute; left: 52px; top: 4px; width: 286px; height: 394px; border-radius: 22px; background: {{halo}}; filter: blur(24px)"></div>
<div style="position: relative; width: 270px; height: 378px; perspective: 1200px">
<div style="position: relative; width: 270px; height: 378px; transform-style: preserve-3d; transform: rotateY({{giro}}deg); transition: transform 0.55s cubic-bezier(0.77, 0, 0.175, 1)">
<div style="position: absolute; left: 0; top: 0; backface-visibility: hidden">
<dc-import name="CartaDorso" size="270" hint-size="270px,378px"></dc-import>
</div>
<div style="position: absolute; left: 0; top: 0; backface-visibility: hidden; transform: rotateY(180deg)">
<dc-import name="Carta" ave="{{ave}}" acabado="{{acabado}}" obs="{{obs}}" size="270" quieta="true" destello="{{destello}}" hint-size="270px,378px"></dc-import>
</div>
</div>
</div>
<sc-if value="{{conEtiqueta}}" hint-placeholder-val="{{ false }}">
<span style="position: absolute; left: 50%; bottom: 2px; transform: translateX(-50%); font-size: 12.5px; font-weight: 700; color: #14302F; background: #F2EAB8; border-radius: 999px; padding: 4px 11px; white-space: nowrap">Repetida</span>
</sc-if>
</div>

<section role="status" style="position: relative; flex: none; padding: 6px 28px 0; display: flex; flex-direction: column; align-items: center; gap: 4px; text-align: center; opacity: {{textoOp}}; transition: opacity 0.3s ease">
<span style="font-size: 13px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: #F2EAB8">{{titulo}}</span>
<h1 style="margin: 2px 0 0; font-family: 'Bricolage Grotesque', 'Avenir Next', system-ui, sans-serif; font-size: 30px; font-weight: 800; letter-spacing: -0.015em; line-height: 1.05">{{nombre}}</h1>
<span style="font-family: 'Instrument Serif', Georgia, serif; font-style: italic; font-size: 19px; color: #C9D8D4">{{cientifico}}</span>
<p style="margin: 4px 0 0; font-size: 14.5px; line-height: 1.45; color: #C9D8D4; text-wrap: pretty">{{texto}}</p>
</section>

<div style="position: relative; margin-top: auto; padding: 0 20px 24px; display: flex; flex-direction: column; gap: 10px; flex: none; opacity: {{textoOp}}; transition: opacity 0.3s ease">
<sc-if value="{{mejora}}" hint-placeholder-val="{{ true }}">
<dc-import name="Boton" texto="Ver en el álbum" variante="claro" href="Album.dc.html" ancho="350" hint-size="350px,52px"></dc-import>
<button onClick="{{siguiente}}" style="min-height: 48px; box-sizing: border-box; border-radius: 14px; border: 1.5px solid rgba(243,237,226,0.45); background: transparent; color: #F3EDE2; font-family: inherit; font-size: 15px; font-weight: 700; cursor: pointer">Abrir el siguiente sobre</button>
</sc-if>
<sc-if value="{{repetida}}" hint-placeholder-val="{{ false }}">
<dc-import name="Boton" texto="Guardar" variante="claro" href="MisRepetidas.dc.html" ancho="350" hint-size="350px,52px"></dc-import>
<a href="MisRepetidas.dc.html" style="min-height: 48px; box-sizing: border-box; border-radius: 14px; border: 1.5px solid rgba(243,237,226,0.45); color: #F3EDE2; font-size: 15px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none"><dc-import name="MonedaPluma" size="20" hint-size="20px,20px"></dc-import>Reciclar · 5 plumas</a>
</sc-if>
</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"caso":{"editor":"enum","options":["mejora","repetida"],"default":"mejora"},"$preview":{"width":390,"height":844}}'>
const CASOS = {
  mejora: {
    ave: 'gaviota', acabado: 'plata', obs: 3, etiqueta: 'Sobre 1 de 2', titulo: '¡Mejora tu álbum!', nombre: 'Gaviota Peruana', cientifico: 'Larus belcheri',
    texto: 'Ganaste la plata en un sobre. Ya se pegó en su casilla.', halo: 'rgba(201,208,213,0.5)'
  },
  repetida: {
    ave: 'churrete', acabado: 'oro', obs: 6, etiqueta: 'Sobre 2 de 2', titulo: 'Oro repetido', nombre: 'Churrete Marisquero', cientifico: 'Cinclodes taczanowskii',
    texto: 'Ya tienes este acabado. Guárdala para cambiarla, que rinde más, o recíclala por plumas.', halo: 'rgba(247,222,142,0.42)'
  }
};
// Lo que la carta se queda de espaldas antes de girar: un momento de intriga.
const INTRIGA = 550;
const GIRO = 600;

class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { caso: props.caso === 'repetida' ? 'repetida' : 'mejora', revelada: false, destello: 0 };
  }

  componentDidMount() {
    this.revelar(INTRIGA);
  }

  componentWillUnmount() {
    (this.relojes ?? []).forEach(clearTimeout);
  }

  luego(ms, cambios) {
    this.relojes = this.relojes ?? [];
    this.relojes.push(setTimeout(() => this.setState(cambios), ms));
  }

  revelar(ms) {
    this.luego(ms, { revelada: true, destello: this.state.destello + 1 });
  }

  renderVals() {
    const { caso, revelada, destello } = this.state;
    return Object.assign({}, CASOS[caso], {
      mejora: caso === 'mejora',
      repetida: caso === 'repetida',
      conEtiqueta: caso === 'repetida' && revelada,
      textoOp: revelada ? 1 : 0,
      giro: revelada ? 180 : 0,
      destello,
      // La carta gira de espaldas antes de cambiar: nada dice qué trajo hasta revelarla.
      siguiente: () => {
        this.setState({ revelada: false });
        this.luego(GIRO, { caso: 'repetida' });
        this.revelar(GIRO + INTRIGA);
      }
    });
  }
}
</script>
</body>
</html>
