<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
// La carta sale de espaldas y gira para mostrarse, igual que en la app.
const INTRIGA = 750;

class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { revelada: false };
  }

  componentDidMount() {
    this.reloj = setTimeout(() => this.setState({ revelada: true }), INTRIGA);
  }

  componentWillUnmount() {
    clearTimeout(this.reloj);
  }

  renderVals() {
    return { giro: this.state.revelada ? 180 : 0 };
  }
}
</script>
