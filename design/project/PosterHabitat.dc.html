<div style="width: {{s.fig}}px; height: {{s.fig}}px; box-sizing: border-box; border-radius: {{s.wrapRadius}}; padding: 3px; background: {{s.ring}}">
<sc-if value="{{s.showFig}}" hint-placeholder-val="{{ false }}">
<div style="width: 100%; height: 100%; border-radius: 50%; background: {{s.tint}}; display: flex; align-items: center; justify-content: center; overflow: hidden"><img src="{{s.img}}" alt="" style="width: {{s.figIn}}px; height: {{s.figIn}}px"></div>

<sc-if value="{{s.showFoto}}" hint-placeholder-val="{{ false }}">

<sc-if value="{{s.names}}" hint-placeholder-val="{{ true }}">
<span style="font-size: 14px; font-weight: 600; line-height: 17px; height: 34px; overflow: hidden; text-align: center; color: {{s.nameColor}}">{{s.nombre}}</span>

</sc-for>
