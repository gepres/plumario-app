<div style="display: flex; flex-direction: column; gap: 8px; min-width: 0">

</div>

<span style="font-family: 'Bricolage Grotesque', 'Avenir Next', system-ui, sans-serif; font-size: 44px; font-weight: 800; line-height: 1; color: {{accent}}">{{done}}/{{total}}</span>
<span style="font-size: 13px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase">especies</span>
</div>
</header>

<div style="flex: 1; min-height: 0; display: grid; grid-template-columns: repeat({{cols}}, minmax(0, 1fr)); gap: 10px; align-content: center">
<sc-for list="{{cells}}" as="s" hint-placeholder-count="50">
<div style="box-sizing: border-box; border-radius: 14px; background: {{s.cardBg}}; padding: 8px 6px; display: flex; flex-direction: column; align-items: center; gap: 4px; min-width: 0">
<div style="width: {{s.fig}}px; height: {{s.fig}}px; box-sizing: border-box; border-radius: {{s.wrapRadius}}; padding: 3px; background: {{s.ring}}">
<sc-if value="{{s.showFig}}" hint-placeholder-val="{{ false }}">
<div style="width: 100%; height: 100%; border-radius: 50%; background: {{s.tint}}; display: flex; align-items: center; justify-content: center; overflow: hidden"><img src="{{s.img}}" alt="" style="width: {{s.figIn}}px; height: {{s.figIn}}px"></div>
</sc-if>
<sc-if value="{{s.showFoto}}" hint-placeholder-val="{{ false }}">
<div style="width: 100%; height: 100%; border-radius: 11px; background: {{s.fotoBg}}; display: flex; align-items: center; justify-content: center; color: #14302F"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4z"></path><circle cx="12" cy="13" r="3.5"></circle></svg></div>
</sc-if>
<sc-if value="{{s.showSombra}}" hint-placeholder-val="{{ true }}">

</sc-if>
</div>
<span style="font-size: 13px; font-weight: 700; color: {{s.numColor}}">{{s.num}}</span>
<sc-if value="{{s.names}}" hint-placeholder-val="{{ true }}">
<span style="font-size: 14px; font-weight: 600; line-height: 17px; height: 34px; overflow: hidden; text-align: center; color: {{s.nameColor}}">{{s.nombre}}</span>
</sc-if>
</div>
</sc-for>
</div>

<footer style="flex: none; border-radius: 14px; background: {{cardBg}}; padding: 12px 18px; display: flex; justify-content: space-between; gap: 24px; font-size: 16px; color: {{sub}}">
<span>{{pie}}</span>
<span style="font-weight: 700; color: {{ink}}">Álbum Aves de Ica · Edición inicial</span>
</footer>
</div>
</div>
