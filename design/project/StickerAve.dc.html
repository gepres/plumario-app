<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Sticker de especie</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&amp;family=Instrument+Sans:wght@400..700&amp;family=Instrument+Serif:ital@0;1&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="position: relative; flex: none; width: {{w}}px; height: {{h}}px; font-family: 'Instrument Sans', 'Segoe UI', system-ui, sans-serif; color: #14302F">
<div style="position: absolute; left: 0; top: 0; width: 160px; height: 205px; transform: scale({{scale}}); transform-origin: 0 0">
<div style="position: absolute; left: 0; top: 0; width: 160px; height: 205px; box-sizing: border-box; border-radius: 14px; background: {{cardBg}}; border: {{cardBorder}}; box-shadow: {{cardShadow}}"></div>
<div style="position: absolute; left: 0; top: 0; width: 160px; height: 205px; border-radius: 14px; background: {{cardHolo}}"></div>
<div style="position: absolute; left: 3px; top: 3px; width: 154px; height: 199px; box-sizing: border-box; border-radius: 11px; border: {{frameBorder}}; box-shadow: {{frameShadow}}"></div>
<div style="position: absolute; left: 7px; top: 7px; width: 146px; height: 146px; border-radius: 10px; overflow: hidden; background: {{plate}}">
<img src="{{img}}" alt="" style="position: absolute; left: 5px; top: 5px; width: 136px; height: 136px; filter: {{imgFilter}}; opacity: {{imgOpacity}}">
<div style="position: absolute; left: 0; top: 0; width: 146px; height: 146px; background: {{plateSheen}}"></div>
<span style="position: absolute; left: 6px; top: 6px; font-size: 11px; font-weight: 700; color: {{numColor}}; background: {{numBg}}; border-radius: 999px; padding: 2px 7px">{{num}}</span>
</div>
<div style="position: absolute; left: 8px; top: 156px; width: 144px; height: 44px; display: flex; align-items: center; justify-content: center; text-align: center; font-size: 13px; font-weight: 700; line-height: 1.15; color: {{nameColor}}; text-shadow: {{nameShadow}}">{{nombre}}</div>
<sc-if value="{{isCromo}}" hint-placeholder-val="{{ false }}">
<sc-for list="{{stars}}" as="s" hint-placeholder-count="3">
<div aria-hidden="true" style="position: absolute; left: {{s.l}}px; top: {{s.t}}px; width: {{s.s}}px; height: {{s.s}}px; background: {{s.c}}; clip-path: polygon(50% 0, 61% 39%, 100% 50%, 61% 61%, 50% 100%, 39% 61%, 0 50%, 39% 39%)"></div>
</sc-for>
<div style="position: absolute; left: 124px; top: -6px; width: 42px; height: 42px; box-sizing: border-box; border-radius: 50%; border: {{badgeBorder}}; background: {{badgeBg}}; box-shadow: {{badgeShadow}}; display: flex; align-items: center; justify-content: center">
<svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="{{icon}}" fill="{{iconFill}}" fill-rule="evenodd"></path><path d="{{icon2}}" fill="{{icon2Fill}}"></path></svg>
</div>
</sc-if>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"img":{"editor":null,"default":"/_blob/700e5a92d8dae9ed43cb6af87296da4a"},"nombre":{"editor":"text","default":"Playero Arenero"},"num":{"editor":"text","default":"011"},"tint":{"editor":"color","default":"#D2E4EC","options":["#D2E4EC","#D9EADB","#EADFCB","#E0DDEA","#CFDCE8"]},"acabado":{"editor":"enum","options":["normal","cromado","plata","oro","rubi","diamante"],"default":"cromado"},"sombra":{"editor":"boolean","default":false},"size":{"editor":"int","default":160,"min":32,"max":640},"$preview":{"width":160,"height":205}}'>
// acabado: "cromado" es el cromo holográfico (categoría base). plata, oro, rubi y diamante son las categorías especiales.
const ICON = {
  star: 'M12 2.5l2.7 6.1 6.6.6-5 4.4 1.5 6.5L12 16.8 6.2 20.1l1.5-6.5-5-4.4 6.6-.6z',
  shield: 'M12 2.5l7.5 3v6c0 4.6-3.2 8.4-7.5 10-4.3-1.6-7.5-5.4-7.5-10v-6z',
  pin: 'M12 2.2a7 7 0 0 0-7 7c0 5.2 7 12.6 7 12.6s7-7.4 7-12.6a7 7 0 0 0-7-7zm0 9.6a2.6 2.6 0 1 1 0-5.2 2.6 2.6 0 0 1 0 5.2z',
  flag: 'M5 2.5h2.2v19H5z M8.2 3.5H19l-3.2 4.6L19 12.7H8.2z',
  gem: 'M7 3.5h10l4.5 5.5L12 21 2.5 9z',
  gemTop: 'M7 3.5h10l4.5 5.5h-19z'
};
const HOLO = 'conic-gradient(from 210deg, #F4C6D6, #C5D9F5, #C3EEDC, #F2EAB8, #DEC8F2, #F4C6D6)';
const star = (cx, cy, s, c) => ({ l: cx - s / 2, t: cy - s / 2, s, c });
const STARS3 = c => [star(110, 40, 18, c), star(27, 122, 14, c), star(139, 104, 10, c)];

const TIER = {
  cromado: {
    cardBg: 'linear-gradient(135deg, #F7F9FA 0%, #B7C0C7 18%, #FFFFFF 34%, #9AA6AE 52%, #EEF1F3 70%, #AAB4BB 86%, #F4F6F7 100%)',
    cardHolo: 'conic-gradient(from 200deg at 50% 45%, rgba(244,198,214,0.42), rgba(197,217,245,0.42), rgba(195,238,220,0.42), rgba(242,234,184,0.42), rgba(222,200,242,0.42), rgba(244,198,214,0.42))',
    frameBorder: '0', frameShadow: 'none',
    plateSheen: 'linear-gradient(120deg, rgba(255,255,255,0) 30%, rgba(255,255,255,0.5) 44%, rgba(255,255,255,0) 58%), conic-gradient(from 90deg at 70% 30%, rgba(244,198,214,0.3), rgba(197,217,245,0.3), rgba(195,238,220,0.3), rgba(242,234,184,0.3), rgba(244,198,214,0.3))',
    stars: STARS3('#FFFFFF'),
    badgeBg: HOLO, badgeBorder: '3px solid #FFFFFF', badgeShadow: '0 2px 6px rgba(20,48,47,0.28)',
    icon: ICON.star, iconFill: '#14302F', icon2: '', icon2Fill: 'none',
    nameColor: '#14302F', nameShadow: 'none', numColor: '#14302F', numBg: '#FFFFFF'
  },
  plata: {
    cardBg: 'linear-gradient(135deg, #F2F4F6 0%, #A7B1B9 16%, #E9EDF0 30%, #7E8B95 48%, #DCE1E5 64%, #8F9BA4 82%, #EEF1F3 100%)',
    cardHolo: 'repeating-linear-gradient(90deg, rgba(255,255,255,0.12) 0 1px, rgba(30,40,48,0.05) 1px 2px)',
    frameBorder: '1px solid rgba(255,255,255,0.9)', frameShadow: 'inset 0 0 0 1px rgba(60,72,80,0.3)',
    plateSheen: 'linear-gradient(120deg, rgba(255,255,255,0) 30%, rgba(255,255,255,0.55) 44%, rgba(255,255,255,0) 58%)',
    stars: [star(110, 40, 14, '#FFFFFF'), star(27, 122, 10, '#FFFFFF')],
    badgeBg: 'linear-gradient(135deg, #FFFFFF 0%, #B9C2C9 45%, #EEF1F3 62%, #95A1AA 100%)', badgeBorder: '3px solid #FFFFFF', badgeShadow: '0 2px 6px rgba(20,48,47,0.28)',
    icon: ICON.shield, iconFill: '#2F3B43', icon2: '', icon2Fill: 'none',
    nameColor: '#1E2A31', nameShadow: 'none', numColor: '#1E2A31', numBg: '#FFFFFF'
  },
  oro: {
    cardBg: 'linear-gradient(135deg, #FFF4C9 0%, #E0B348 18%, #FFF1BC 34%, #B9872A 52%, #F5D987 70%, #A9781F 86%, #FCE7A2 100%)',
    cardHolo: 'radial-gradient(circle at 28% 18%, rgba(255,255,255,0.4), rgba(255,255,255,0) 48%)',
    frameBorder: '1px solid rgba(255,248,220,0.95)', frameShadow: 'inset 0 0 0 1px rgba(120,82,18,0.35)',
    plateSheen: 'linear-gradient(120deg, rgba(255,240,190,0) 30%, rgba(255,240,190,0.55) 44%, rgba(255,240,190,0) 58%)',
    stars: STARS3('#FFF6D5'),
    badgeBg: 'linear-gradient(135deg, #FFF3C4 0%, #D9A93E 50%, #F7DE8E 70%, #B07F22 100%)', badgeBorder: '3px solid #FFF8E1', badgeShadow: '0 2px 6px rgba(74,52,16,0.35)',
    icon: ICON.pin, iconFill: '#4A3410', icon2: '', icon2Fill: 'none',
    nameColor: '#3B2A0C', nameShadow: 'none', numColor: '#3B2A0C', numBg: '#FFF8E6'
  },
  rubi: {
    cardBg: 'linear-gradient(135deg, #E37A8C 0%, #A51E36 20%, #D24A60 36%, #7A1226 54%, #B8334A 72%, #64101F 88%, #C9566A 100%)',
    cardHolo: 'radial-gradient(circle at 72% 14%, rgba(255,255,255,0.3), rgba(255,255,255,0) 45%)',
    frameBorder: '1.5px solid #E9C46A', frameShadow: 'none',
    plateSheen: 'linear-gradient(120deg, rgba(255,255,255,0) 30%, rgba(255,255,255,0.45) 44%, rgba(255,255,255,0) 58%)',
    stars: STARS3('#FFE7A8'),
    badgeBg: 'linear-gradient(135deg, #E8687C 0%, #9C1B31 55%, #6A0F1F 100%)', badgeBorder: '3px solid #E9C46A', badgeShadow: '0 2px 6px rgba(60,10,20,0.4)',
    icon: ICON.flag, iconFill: '#FFFFFF', icon2: '', icon2Fill: 'none',
    nameColor: '#FFFFFF', nameShadow: '0 1px 1px rgba(40,0,10,0.45)', numColor: '#6A0F1F', numBg: '#FFFFFF'
  },
  diamante: {
    cardBg: 'conic-gradient(from 22deg at 50% 40%, #F7FCFF, #CDE5F1, #FFFFFF, #B5D2E2, #EEF8FD, #C4DEEC, #FFFFFF, #A9C8DA, #F2FAFE, #C9E2EF, #F7FCFF)',
    cardHolo: 'linear-gradient(115deg, rgba(197,217,245,0) 18%, rgba(244,198,214,0.38) 36%, rgba(195,238,220,0.38) 50%, rgba(242,234,184,0.32) 62%, rgba(197,217,245,0) 78%)',
    frameBorder: '1px solid rgba(255,255,255,0.95)', frameShadow: 'inset 0 0 0 1px rgba(80,140,170,0.35)',
    plateSheen: 'linear-gradient(120deg, rgba(255,255,255,0) 28%, rgba(255,255,255,0.6) 42%, rgba(255,255,255,0) 56%), conic-gradient(from 90deg at 70% 30%, rgba(197,217,245,0.28), rgba(244,198,214,0.28), rgba(195,238,220,0.28), rgba(197,217,245,0.28))',
    stars: [star(110, 40, 20, '#FFFFFF'), star(27, 122, 16, '#FFFFFF'), star(139, 104, 12, '#FFFFFF'), star(34, 30, 10, '#FFFFFF'), star(112, 140, 9, '#FFFFFF')],
    badgeBg: '#16324A', badgeBorder: '3px solid #FFFFFF', badgeShadow: '0 0 0 2px #BFE3F2, 0 2px 8px rgba(20,48,47,0.35)',
    icon: ICON.gem, iconFill: '#9FD3EA', icon2: ICON.gemTop, icon2Fill: '#FFFFFF',
    nameColor: '#14302F', nameShadow: 'none', numColor: '#16324A', numBg: '#FFFFFF'
  }
};

class Component extends DCLogic {
  renderVals() {
    const size = Number(this.props.size ?? 160) || 160;
    const sombra = this.props.sombra === true || this.props.sombra === 'true';
    const acabado = this.props.acabado ?? 'cromado';
    const tier = sombra ? null : TIER[acabado];
    const tint = this.props.tint ?? '#D2E4EC';
    const base = {
      w: size,
      h: Math.round(size * 205 / 160),
      scale: size / 160,
      img: this.props.img ?? '/_blob/700e5a92d8dae9ed43cb6af87296da4a',
      nombre: this.props.nombre ?? 'Playero Arenero',
      num: this.props.num ?? '011',
      isCromo: !!tier,
      frameBorder: '0',
      frameShadow: 'none',
      nameShadow: 'none',
      stars: []
    };
    if (sombra) {
      return Object.assign(base, {
        cardBg: '#F1ECE2',
        cardBorder: '1.5px dashed #C9BEA9',
        cardShadow: 'none',
        cardHolo: 'none',
        plate: '#E7E1D5',
        imgFilter: 'brightness(0)',
        imgOpacity: 0.17,
        plateSheen: 'none',
        numColor: '#5F5B54',
        numBg: 'rgba(255,255,255,0.75)',
        nameColor: '#5F5B54'
      });
    }
    if (tier) {
      return Object.assign(base, tier, {
        cardBorder: '1px solid rgba(255,255,255,0.9)',
        cardShadow: acabado === 'diamante'
          ? '0 1px 2px rgba(20,48,47,0.22), 0 8px 22px rgba(44,106,134,0.34)'
          : '0 1px 2px rgba(20,48,47,0.22), 0 8px 20px rgba(20,48,47,0.18)',
        plate: tint,
        imgFilter: 'none',
        imgOpacity: 1
      });
    }
    return Object.assign(base, {
      cardBg: '#FFFFFF',
      cardBorder: '0',
      cardShadow: '0 1px 2px rgba(20,48,47,0.2), 0 4px 10px rgba(20,48,47,0.08)',
      cardHolo: 'none',
      plate: tint,
      imgFilter: 'none',
      imgOpacity: 1,
      plateSheen: 'none',
      numColor: '#14302F',
      numBg: '#FFFFFF',
      nameColor: '#14302F'
    });
  }
}
</script>
</body>
</html>
