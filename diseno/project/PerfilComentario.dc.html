<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Enviar un comentario</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&amp;family=Instrument+Sans:wght@400..700&amp;family=Instrument+Serif:ital@0;1&amp;display=swap">
<style>
body{margin:0}
a{color:#14302F}a:hover{color:#2C6A86}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; box-sizing: border-box; overflow: hidden; background: #F3EDE2; color: #14302F; font-family: 'Instrument Sans', 'Segoe UI', system-ui, sans-serif; display: flex; flex-direction: column">

<header style="flex: none; display: flex; align-items: center; gap: 4px; height: 56px; padding: 0 8px">
<a href="PerfilAyuda.dc.html" aria-label="Volver" style="width: 44px; height: 44px; border-radius: 12px; display: flex; align-items: center; justify-content: center; color: #14302F">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg>
</a>
<h1 style="margin: 0; font-family: 'Bricolage Grotesque', 'Avenir Next', system-ui, sans-serif; font-size: 20px; font-weight: 700">Enviar un comentario</h1>
</header>

<sc-if value="{{formulario}}" hint-placeholder-val="{{ true }}">
<main style="flex: 1; min-height: 0; padding: 0 16px 18px; display: flex; flex-direction: column; gap: 14px">
<p style="margin: 0 4px; font-size: 14px; line-height: 1.45; color: #3F504E">Leemos todo. Si es un error, cuéntanos qué estabas haciendo cuando pasó.</p>

<fieldset style="margin: 0; padding: 0; border: 0; display: flex; flex-direction: column; gap: 8px">
<legend style="padding: 0; margin: 0 4px 8px; font-size: 13.5px; font-weight: 700">Sobre qué es</legend>
<div style="display: flex; flex-wrap: wrap; gap: 6px">
<sc-for list="{{tipos}}" as="t" hint-placeholder-count="4">
<button aria-pressed="{{t.pressed}}" onClick="{{t.pick}}" style="min-height: 40px; box-sizing: border-box; border-radius: 999px; border: {{t.borde}}; background: {{t.bg}}; color: {{t.ink}}; font-family: inherit; font-size: 13.5px; font-weight: 700; padding: 0 14px; cursor: pointer">{{t.label}}</button>
</sc-for>
</div>
</fieldset>

<label style="display: flex; flex-direction: column; gap: 6px">
<span style="margin: 0 4px; font-size: 13.5px; font-weight: 700">Tu comentario</span>
<textarea rows="6" maxlength="500" placeholder="{{placeholder}}" style="min-height: 150px; box-sizing: border-box; padding: 12px 14px; border: 1px solid #C9BEA9; border-radius: 14px; background: #FFFFFF; color: #14302F; font-family: inherit; font-size: 15px; line-height: 1.45; resize: none"></textarea>
<span style="align-self: flex-end; margin: 0 4px; font-size: 12px; color: #4E5E5C">Hasta 500 caracteres</span>
</label>

<div style="display: flex; flex-direction: column; gap: 2px">
<sc-for list="{{checks}}" as="c" hint-placeholder-count="2">
<label style="min-height: 44px; display: flex; align-items: center; gap: 10px; font-size: 13.5px; line-height: 1.35; color: #3F504E; cursor: pointer">
<input type="checkbox" checked="{{c.on}}" onChange="{{c.toggle}}" style="flex: none; width: 20px; height: 20px; margin: 0; accent-color: #14302F">
<span>{{c.texto}}</span>
</label>
</sc-for>
</div>

<button onClick="{{enviar}}" style="margin-top: auto; min-height: 52px; border: 0; border-radius: 14px; background: #14302F; color: #FFFFFF; font-family: inherit; font-size: 15.5px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 8px; cursor: pointer">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12l16-8-6 16-2.5-6.5z"></path></svg>Enviar
</button>
</main>
</sc-if>

<sc-if value="{{enviado}}" hint-placeholder-val="{{ false }}">
<main role="status" style="flex: 1; min-height: 0; padding: 40px 24px 18px; display: flex; flex-direction: column; align-items: center; gap: 12px; text-align: center">
<span aria-hidden="true" style="width: 76px; height: 76px; border-radius: 50%; background: #D9EADB; color: #2D5F41; display: flex; align-items: center; justify-content: center"><svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg></span>
<h2 style="margin: 4px 0 0; font-family: 'Bricolage Grotesque', 'Avenir Next', system-ui, sans-serif; font-size: 26px; font-weight: 800">¡Gracias!</h2>
<p style="margin: 0; font-size: 15px; line-height: 1.5; color: #3F504E">Recibimos tu comentario. Si nos diste permiso, te responderemos a tu correo.</p>
<a href="PerfilAyuda.dc.html" style="margin-top: auto; align-self: stretch; min-height: 52px; border-radius: 14px; background: #14302F; color: #FFFFFF; font-size: 15.5px; font-weight: 700; display: flex; align-items: center; justify-content: center; text-decoration: none">Volver a ayuda</a>
</main>
</sc-if>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
const TIPOS = [
  { id: 'idea', label: 'Una idea', ph: 'Cuéntanos tu idea para el álbum…' },
  { id: 'error', label: 'Un error', ph: 'Qué pasó y qué estabas haciendo…' },
  { id: 'ave', label: 'Ave mal identificada', ph: 'Qué especie salió y cuál crees que es…' },
  { id: 'otro', label: 'Otro', ph: 'Escribe tu comentario…' }
];
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { tipo: 'idea', captura: false, contacto: true, enviado: false };
  }
  renderVals() {
    const st = this.state;
    const actual = TIPOS.filter(t => t.id === st.tipo)[0];
    return {
      formulario: !st.enviado,
      enviado: st.enviado,
      placeholder: actual.ph,
      enviar: () => this.setState({ enviado: true }),
      tipos: TIPOS.map(t => ({
        label: t.label,
        pressed: st.tipo === t.id ? 'true' : 'false',
        bg: st.tipo === t.id ? '#14302F' : 'transparent',
        ink: st.tipo === t.id ? '#FFFFFF' : '#14302F',
        borde: st.tipo === t.id ? '1.5px solid #14302F' : '1px solid #C9BEA9',
        pick: () => this.setState({ tipo: t.id })
      })),
      checks: [
        { texto: 'Adjuntar una captura de pantalla', on: st.captura, toggle: () => this.setState({ captura: !st.captura }) },
        { texto: 'Pueden responderme a mi correo', on: st.contacto, toggle: () => this.setState({ contacto: !st.contacto }) }
      ]
    };
  }
}
</script>
</body>
</html>
