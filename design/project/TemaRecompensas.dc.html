<sc-for list="{{medallas}}" as="m" hint-placeholder-count="3">

</sc-for>
</div>
</section>

<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
<sc-for list="{{pendientes}}" as="m" hint-placeholder-count="3">

</sc-for>
</div>
</section>
</main>
