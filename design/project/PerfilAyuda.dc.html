<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Ayuda y comentarios</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&amp;family=Instrument+Sans:wght@400..700&amp;family=Instrument+Serif:ital@0;1&amp;display=swap">
<style>
body{margin:0}
a{color:#14302F}a:hover{color:#2C6A86}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; box-sizing: border-box; overflow: hidden; background: #F3EDE2; color: #14302F; font-family: 'Instrument Sans', 'Segoe UI', system-ui, sans-serif; display: flex; flex-direction: column">

<header style="flex: none; display: flex; align-items: center; gap: 4px; height: 56px; padding: 0 8px">
<a href="Perfil.dc.html" aria-label="Volver" style="width: 44px; height: 44px; border-radius: 12px; display: flex; align-items: center; justify-content: center; color: #14302F">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg>
</a>
<h1 style="margin: 0; font-family: 'Bricolage Grotesque', 'Avenir Next', system-ui, sans-serif; font-size: 20px; font-weight: 700">Ayuda y comentarios</h1>
</header>

<label style="flex: none; margin: 0 16px; min-height: 48px; box-sizing: border-box; padding: 0 14px; border: 1px solid #C9BEA9; border-radius: 14px; background: #FFFFFF; display: flex; align-items: center; gap: 10px">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#4E5E5C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="6.5"></circle><path d="M16 16l4.5 4.5"></path></svg>
<span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%)">Buscar en la ayuda</span>
<input type="search" placeholder="Buscar en la ayuda" style="flex: 1; min-width: 0; border: 0; background: transparent; color: #14302F; font-family: inherit; font-size: 15px">
</label>

<section aria-labelledby="faq" style="flex: none; margin: 14px 16px 0; display: flex; flex-direction: column; gap: 8px">
<h2 id="faq" style="margin: 0 4px; font-family: 'Bricolage Grotesque', 'Avenir Next', system-ui, sans-serif; font-size: 16px; font-weight: 700">Preguntas frecuentes</h2>
<div style="background: #FBF8F2; border: 1px solid #E3DACA; border-radius: 18px; overflow: hidden">
<sc-for list="{{faqs}}" as="q" hint-placeholder-count="6">
<div style="border-top: {{q.borde}}">
<button onClick="{{q.toggle}}" aria-expanded="{{q.expanded}}" style="width: 100%; min-height: 52px; box-sizing: border-box; padding: 8px 14px; border: 0; background: transparent; color: #14302F; font-family: inherit; text-align: left; display: flex; align-items: center; gap: 12px; cursor: pointer">
<span style="flex: 1; font-size: 14.5px; font-weight: 700; line-height: 1.3">{{q.p}}</span>
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#4E5E5C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none; transform: rotate({{q.giro}}deg)"><path d="M6 9l6 6 6-6"></path></svg>
</button>
<sc-if value="{{q.abierta}}" hint-placeholder-val="{{ false }}">
<p style="margin: -2px 14px 12px; font-size: 13.5px; line-height: 1.45; color: #3F504E">{{q.r}}</p>
</sc-if>
</div>
</sc-for>
</div>
</section>

<section aria-labelledby="contacto" style="flex: none; margin: 14px 16px 0; padding: 14px 16px; background: #ECE5D7; border-radius: 18px; display: flex; flex-direction: column; gap: 10px">
<h2 id="contacto" style="margin: 0; font-family: 'Bricolage Grotesque', 'Avenir Next', system-ui, sans-serif; font-size: 16px; font-weight: 700">¿No encontraste tu respuesta?</h2>
<div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px">
<a href="PerfilComentario.dc.html" style="min-height: 48px; border-radius: 14px; background: #14302F; color: #FFFFFF; font-size: 14px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 6px; text-decoration: none"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5h16v11H9l-5 4z"></path></svg>Comentario</a>
<a href="PerfilComentario.dc.html" style="min-height: 48px; box-sizing: border-box; border-radius: 14px; border: 1.5px solid #14302F; color: #14302F; font-size: 14px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 6px; text-decoration: none"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l9.5 17h-19z"></path><path d="M12 10v4M12 17h.01"></path></svg>Un error</a>
</div>
</section>

<p style="flex: none; margin: auto 0 18px; text-align: center; font-size: 12px; color: #4E5E5C">Plumario 1.0 · Edición Ica</p>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
const FAQS = [
  { p: '¿Por qué mi sticker no salió cromado?', r: 'Al completar un sticker, 1 de cada 8 sale holográfico. También ganas cromos con 3 observaciones o más, en sobres, con plumas o por intercambio.' },
  { p: 'Tomé otra foto de la misma ave. ¿Cuenta?', r: 'Cuenta 1 observación por especie y día; en especies amenazadas, 1 por semana. Las fotos de más van a la galería de esa especie.' },
  { p: '¿Qué son las plumas?', r: 'Las ganas con cada observación válida y reciclando repetidas. Sirven para subir un acabado o para intercambiar. Nunca se venden.' },
  { p: 'La app no reconoce mi foto', r: 'Prueba con una foto donde el ave se vea entera y nítida. Si sabes qué especie es, puedes elegirla de la lista.' },
  { p: '¿Cuándo se habilita el póster de un hábitat?', r: 'Al completar todas sus especies. Mientras, lo ves con las que faltan en sombra. Cada 10 especies también ganas un póster con tus aves.' },
  { p: '¿Cómo cambio de región?', r: 'Toca el título de Inicio o entra a Perfil › Mi región.' },
  { p: '¿Alguien ve dónde tomé mis fotos?', r: 'No. La ubicación solo asigna la foto a su región, y en especies amenazadas se oculta siempre.' }
];
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { abierta: 0 };
  }
  renderVals() {
    const ab = this.state.abierta;
    return {
      faqs: FAQS.map((q, i) => Object.assign({}, q, {
        abierta: ab === i,
        expanded: ab === i ? 'true' : 'false',
        giro: ab === i ? 180 : 0,
        borde: i === 0 ? '0' : '1px solid #E3DACA',
        toggle: () => this.setState({ abierta: ab === i ? -1 : i })
      }))
    };
  }
}
</script>
</body>
</html>
