<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Registrar · identificar el ave</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&amp;family=Instrument+Sans:wght@400..700&amp;family=Instrument+Serif:ital@0;1&amp;display=swap">
<style>
body{margin:0}
a{color:#14302F}a:hover{color:#2C6A86}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; overflow: hidden; background: #F3EDE2; color: #14302F; font-family: 'Instrument Sans', 'Segoe UI', system-ui, sans-serif; display: flex; flex-direction: column">

<header style="flex: none; display: flex; align-items: center; gap: 4px; height: 56px; padding: 0 8px">
<a href="RegistrarCamara.dc.html" aria-label="Volver a la cámara" style="width: 44px; height: 44px; border-radius: 12px; display: flex; align-items: center; justify-content: center; color: #14302F">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg>
</a>
<h1 style="margin: 0; font-family: 'Bricolage Grotesque', 'Avenir Next', system-ui, sans-serif; font-size: 20px; font-weight: 700">¿Qué ave es?</h1>
</header>

<div role="img" aria-label="Tu foto" style="position: relative; flex: none; margin: 0 16px; height: 196px; border-radius: 18px; overflow: hidden; background: linear-gradient(180deg, #A9C0C6 0%, #93B1BA 38%, #6F95A0 39%, #7FA2AC 58%, #C2B496 59%, #B3A383 100%)">
<img src="/_blob/31adf2ccfda616d427f1071e70cab14c" alt="" style="position: absolute; left: 112px; top: 18px; width: 160px; height: 160px; filter: saturate(0.75) contrast(0.95)">
<span style="position: absolute; left: 10px; bottom: 10px; font-size: 12px; font-weight: 700; color: #FFFFFF; background: rgba(11,20,20,0.55); border-radius: 999px; padding: 4px 10px">Tu foto · 24 oct 2026</span>
</div>

<div style="flex: none; margin: 16px 20px 0; display: flex; flex-direction: column; gap: 2px">
<h2 style="margin: 0; font-family: 'Bricolage Grotesque', 'Avenir Next', system-ui, sans-serif; font-size: 18px; font-weight: 700">La IA sugiere</h2>
<span style="font-size: 13px; color: #4E5E5C">Toca el sticker que corresponde a tu foto.</span>
</div>

<div role="radiogroup" aria-label="Especies sugeridas" style="flex: none; margin: 10px 16px 0; display: flex; flex-direction: column; gap: 8px">
<sc-for list="{{opciones}}" as="o" hint-placeholder-count="3">
<button role="radio" aria-checked="{{o.checked}}" onClick="{{o.pick}}" style="min-height: 92px; box-sizing: border-box; border-radius: 16px; border: {{o.border}}; background: {{o.bg}}; padding: 8px 14px 8px 10px; display: flex; align-items: center; gap: 12px; text-align: left; font-family: inherit; color: #14302F; cursor: pointer">
<dc-import name="StickerAve" img="{{o.img}}" nombre="{{o.nombre}}" num="{{o.num}}" tint="#D2E4EC" acabado="normal" sombra="{{o.sombra}}" size="58" hint-size="58px,74px"></dc-import>
<span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px">
<span style="font-size: 15.5px; font-weight: 700">{{o.nombre}}</span>
<span style="font-size: 12.5px; color: #4E5E5C">N.º {{o.num}} · {{o.estado}}</span>
<span style="align-self: flex-start; font-size: 11.5px; font-weight: 700; color: {{o.tagColor}}; background: {{o.tagBg}}; border-radius: 999px; padding: 2px 8px">{{o.tag}}</span>
</span>
<span aria-hidden="true" style="flex: none; width: 22px; height: 22px; box-sizing: border-box; border-radius: 50%; border: {{o.dot}}"></span>
</button>
</sc-for>
</div>

<a href="Album.dc.html" style="flex: none; margin: 10px 20px 0; min-height: 44px; display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 700; color: #2C6A86; text-decoration: none">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="6.5"></circle><path d="M16 16l4.5 4.5"></path></svg>No es ninguna: buscar en el álbum
</a>

<div style="margin-top: auto; padding: 0 16px 22px; flex: none">
<a href="RegistrarColocar.dc.html" style="min-height: 52px; border-radius: 14px; background: #14302F; color: #FFFFFF; font-size: 15.5px; font-weight: 700; display: flex; align-items: center; justify-content: center; text-decoration: none">{{cta}}</a>
</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { sel: 0 };
  }
  renderVals() {
    const base = [
      { nombre: 'Gaviota Dominicana', num: '023', img: '/_blob/95828bd5b7fe0dda93d787c2e178af86', sombra: true, estado: 'Sticker vacío', tag: 'Más probable', tagColor: '#FFFFFF', tagBg: '#2C6A86' },
      { nombre: 'Gaviota Gris', num: '019', img: '/_blob/95828bd5b7fe0dda93d787c2e178af86', sombra: true, estado: 'Sticker vacío', tag: 'Posible', tagColor: '#14302F', tagBg: '#E3DACA' },
      { nombre: 'Gaviota Peruana', num: '022', img: '/_blob/95828bd5b7fe0dda93d787c2e178af86', sombra: false, estado: 'Ya está en tu álbum', tag: 'Irá a su galería', tagColor: '#14302F', tagBg: '#E3DACA' }
    ];
    const sel = this.state.sel;
    const opciones = base.map((o, i) => Object.assign({}, o, {
      checked: i === sel ? 'true' : 'false',
      border: i === sel ? '2px solid #14302F' : '1px solid #E3DACA',
      bg: i === sel ? '#FBF8F2' : 'transparent',
      dot: i === sel ? '7px solid #14302F' : '2px solid #B9AE99',
      pick: () => this.setState({ sel: i })
    }));
    const elegido = base[sel];
    return {
      opciones: opciones,
      cta: elegido.sombra ? 'Colocar en ' + elegido.nombre : 'Agregar a la galería de ' + elegido.nombre
    };
  }
}
</script>
</body>
</html>
