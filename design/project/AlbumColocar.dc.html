</div>
<span style="font-size: 11.5px; font-weight: 700; line-height: 1.15; text-align: center; padding: 0 2px">{{ave.name}}</span>

<div style="position: absolute; left: 226px; top: 338px; transform: rotate(-9deg); filter: drop-shadow(0 14px 14px rgba(20,48,47,0.28))">
<dc-import name="Sticker" kind="litoral" size="98" hint-size="98px,98px"></dc-import>
</div>
</section>

</div>
<div style="width: 80px; display: flex; flex-direction: column; align-items: center; gap: 4px">

</div>
<div style="width: 80px; display: flex; flex-direction: column; align-items: center; gap: 4px">
<div style="width: 60px; height: 60px; box-sizing: border-box; border-radius: 50%; border: 2px dashed #8E8677"></div>
<span style="font-size: 11px; font-weight: 600; color: #2C6A86">Colocando…</span>
