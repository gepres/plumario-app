<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Intercambio · pedir un cromo</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&amp;family=Instrument+Sans:wght@400..700&amp;family=Instrument+Serif:ital@0;1&amp;display=swap">
<style>
body{margin:0}
a{color:#14302F}a:hover{color:#2C6A86}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; overflow: hidden; background: #F3EDE2; color: #14302F; font-family: 'Instrument Sans', 'Segoe UI', system-ui, sans-serif; display: flex; flex-direction: column">

<header style="flex: none; display: flex; align-items: center; gap: 4px; height: 56px; padding: 0 8px">
<a href="RecompensasStickers.dc.html" aria-label="Volver" style="width: 44px; height: 44px; border-radius: 12px; display: flex; align-items: center; justify-content: center; color: #14302F">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg>
</a>
<h1 style="margin: 0; font-family: 'Bricolage Grotesque', 'Avenir Next', system-ui, sans-serif; font-size: 20px; font-weight: 700">Pedir un cromo</h1>
</header>

<section aria-labelledby="quieres" style="flex: none; margin: 0 16px; padding: 14px; background: #FBF8F2; border: 1px solid #E3DACA; border-radius: 18px; display: flex; align-items: center; gap: 14px">
<dc-import name="StickerAve" img="/_blob/95828bd5b7fe0dda93d787c2e178af86" nombre="Gaviota Peruana" num="022" tint="#D2E4EC" acabado="{{pedido.acabado}}" size="96" hint-size="96px,123px"></dc-import>
<div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px">
<span id="quieres" style="font-size: 12px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: #2C6A86">Quieres</span>
<span style="font-size: 17px; font-weight: 700; line-height: 1.2">Gaviota Peruana</span>
<span style="font-size: 13px; color: #3F504E">Cromo {{pedido.texto}}</span>
<span style="display: flex; align-items: center; gap: 5px; font-size: 12.5px; font-weight: 600; color: #2D5F41"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>Ya tienes su sticker normal</span>
</div>
</section>

<div role="group" aria-label="Acabado del intercambio" style="flex: none; margin: 10px 16px 0; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 4px">
<sc-for list="{{acabados}}" as="a" hint-placeholder-count="5">
<button aria-pressed="{{a.pressed}}" disabled="{{a.off}}" onClick="{{a.pick}}" style="min-height: 44px; padding: 0 2px; border-radius: 10px; border: {{a.borde}}; background: {{a.bg}}; opacity: {{a.op}}; color: #14302F; font-family: inherit; font-size: 11px; font-weight: 700; cursor: {{a.cursor}}">{{a.label}}</button>
</sc-for>
</div>

<div aria-hidden="true" style="flex: none; height: 32px; display: flex; align-items: center; justify-content: center; color: #4E5E5C">
<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 4v16M8 20l-4-4M16 20V4M16 4l4 4"></path></svg>
</div>

<fieldset style="flex: none; margin: 0 16px; padding: 0; border: 0; display: flex; flex-direction: column; gap: 8px">
<legend style="padding: 0; margin-bottom: 8px; font-size: 12px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: #8A4F12">Ofreces a cambio</legend>
<sc-for list="{{ofertas}}" as="o" hint-placeholder-count="2">
<label style="min-height: 84px; box-sizing: border-box; border-radius: 16px; border: {{o.border}}; background: {{o.bg}}; padding: 8px 14px 8px 10px; display: flex; align-items: center; gap: 12px; cursor: pointer">
<input type="radio" name="oferta" value="{{o.num}}" checked="{{o.checked}}" onChange="{{o.pick}}" style="width: 20px; height: 20px; margin: 0; accent-color: #14302F">
<dc-import name="StickerAve" img="{{o.img}}" nombre="{{o.nombre}}" num="{{o.num}}" tint="#D2E4EC" acabado="{{o.acabado}}" size="52" hint-size="52px,67px"></dc-import>
<span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px">
<span style="font-size: 15px; font-weight: 700">{{o.nombre}}</span>
<span style="font-size: 12.5px; color: #4E5E5C">{{o.cat}} · {{o.como}}</span>
</span>
</label>
</sc-for>
</fieldset>

<p style="flex: none; margin: 14px 20px 0; font-size: 12.5px; line-height: 1.45; color: #4E5E5C">Das y recibes el mismo acabado. Tu álbum no pierde nada. Solo se recibe un acabado superior al tuyo, de un ave que ya registraste.</p>

<div style="margin-top: auto; padding: 0 16px 22px; flex: none; display: flex; flex-direction: column; gap: 10px">
<sc-if value="{{falta}}" hint-placeholder-val="{{ false }}">
<span aria-disabled="true" style="min-height: 52px; border-radius: 14px; background: #E7DFCF; color: #5F5B54; font-size: 15.5px; font-weight: 700; display: flex; align-items: center; justify-content: center">{{faltaTexto}}</span>
</sc-if>
<sc-if value="{{alcanza}}" hint-placeholder-val="{{ true }}">
<a href="IntercambioRecibido.dc.html" style="min-height: 52px; border-radius: 14px; background: #14302F; color: #FFFFFF; font-size: 15.5px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 15V3"></path><path d="M7.5 7.5L12 3l4.5 4.5"></path><path d="M5 12v7a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-7"></path></svg>Enviar propuesta por enlace
</a>
</sc-if>
<button style="min-height: 48px; box-sizing: border-box; border-radius: 14px; border: 1.5px solid #14302F; background: transparent; color: #14302F; font-family: inherit; font-size: 15px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 8px; cursor: pointer">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="4" width="6" height="6"></rect><rect x="14" y="4" width="6" height="6"></rect><rect x="4" y="14" width="6" height="6"></rect><path d="M14 14h2v2h-2zM18 18h2v2h-2zM14 18h2M18 14h2"></path></svg>Mostrar código QR
</button>
</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"saldo":{"editor":"int","default":34,"min":0,"max":200},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { sel: 0, nivel: 1 };
  }
  renderVals() {
    const ACABADOS = [
      { id: 'cromado', label: 'Holográfico', texto: 'holográfico', precio: 6 },
      { id: 'plata', label: 'Plata', texto: 'de plata', precio: 10 },
      { id: 'oro', label: 'Oro', texto: 'de oro', precio: 20 },
      { id: 'rubi', label: 'Rubí', texto: 'de rubí', precio: 50 },
      { id: 'diamante', label: 'Diamante', texto: 'de diamante', precio: 120 }
    ];
    // Solo se ofrece lo ganado: mejor es el nivel más alto de cada ave; repetida, el nivel que sobra.
    const MIAS = [
      { nombre: 'Gaviotín Zarcillo', num: '025', img: '/_blob/cdb078ae3f20d0b791f60aa76ef64daf', mejor: 1, repetida: 1 },
      { nombre: 'Playero Arenero', num: '011', img: '/_blob/700e5a92d8dae9ed43cb6af87296da4a', mejor: 0, repetida: -1 }
    ];
    const saldo = this.props.saldo ?? 34;
    const techo = Math.max(...MIAS.map((m) => m.mejor));
    const nivel = this.state.nivel;
    const pedido = ACABADOS[nivel];
    const lista = MIAS.filter((m) => m.mejor >= nivel);
    const sel = Math.min(this.state.sel, lista.length - 1);
    const elegida = lista[sel];
    const pagada = elegida.repetida !== nivel;
    const faltan = pagada ? pedido.precio - saldo : 0;
    return {
      pedido: { acabado: pedido.id, texto: pedido.texto },
      acabados: ACABADOS.map((a, i) => ({
        label: a.label,
        pressed: i === nivel ? 'true' : 'false',
        off: i > techo,
        borde: i === nivel ? '2px solid #14302F' : '1px solid #E3DACA',
        bg: i === nivel ? '#FBF8F2' : 'transparent',
        op: i > techo ? 0.45 : 1,
        cursor: i > techo ? 'default' : 'pointer',
        pick: () => this.setState({ nivel: i, sel: 0 })
      })),
      falta: faltan > 0,
      alcanza: faltan <= 0,
      faltaTexto: 'Te faltan ' + faltan + ' plumas',
      ofertas: lista.map((m, i) => ({
        nombre: m.nombre, num: m.num, img: m.img,
        acabado: pedido.id,
        cat: pedido.label,
        como: m.repetida === nivel ? 'Entregas tu repetida' : (saldo >= pedido.precio ? 'Te cuesta ' + pedido.precio + ' plumas. Te quedarán ' + (saldo - pedido.precio) + '.' : 'Te faltan ' + (pedido.precio - saldo) + ' plumas'),
        checked: i === sel,
        border: i === sel ? '2px solid #14302F' : '1px solid #E3DACA',
        bg: i === sel ? '#FBF8F2' : 'transparent',
        pick: () => this.setState({ sel: i })
      }))
    };
  }
}
</script>
</body>
</html>
