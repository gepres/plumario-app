<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Generar póster 1</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&amp;family=Instrument+Sans:wght@400..700&amp;family=Instrument+Serif:ital@0;1&amp;display=swap">
<style>
body{margin:0}
a{color:#14302F}a:hover{color:#2C6A86}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; overflow: hidden; background: #F3EDE2; color: #14302F; font-family: 'Instrument Sans', 'Segoe UI', system-ui, sans-serif; display: flex; flex-direction: column">

<header style="flex: none; display: flex; align-items: center; gap: 4px; height: 56px; padding: 0 8px">
<a href="Celebracion.dc.html" aria-label="Volver" style="width: 44px; height: 44px; border-radius: 12px; display: flex; align-items: center; justify-content: center; color: #14302F">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg>
</a>
<h1 style="margin: 0; font-family: 'Bricolage Grotesque', 'Avenir Next', system-ui, sans-serif; font-size: 20px; font-weight: 700">Tu póster 1</h1>
</header>

<p style="flex: none; margin: 0 20px 10px; font-size: 14px; line-height: 1.45; color: #3F504E; text-wrap: pretty">Se arma con tus 10 primeras especies. Mézclalo hasta que te guste y guárdalo.</p>

<div style="flex: none; margin: 0 16px; height: 352px; border-radius: 20px; background: #E7DFCF; display: flex; align-items: center; justify-content: center">
<div style="position: relative; width: 232px; height: 328px; overflow: hidden; border-radius: 3px; box-shadow: 0 2px 4px rgba(20,48,47,0.2), 0 14px 30px rgba(20,48,47,0.2)">
<div style="position: absolute; left: 0; top: 0; width: 1123px; height: 1587px; transform: scale(0.20659); transform-origin: 0 0">
<dc-import name="Poster10" numero="1" estado="listo" tema="{{tema}}" seed="{{seed}}" titulo="Mis aves de Ica" hint-size="1123px,1587px"></dc-import>
</div>
</div>
</div>

<section aria-label="Personalizar" style="flex: none; margin: 10px 16px 0; padding: 12px 14px; background: #FBF8F2; border: 1px solid #E3DACA; border-radius: 16px; display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; align-items: center; justify-content: space-between; gap: 10px">
<span style="display: flex; flex-direction: column; gap: 1px"><span style="font-size: 14px; font-weight: 700">Orden</span><span style="font-size: 12px; color: #4E5E5C">Mezclas: {{mezclas}}</span></span>
<button onClick="{{mezclar}}" style="min-height: 42px; border: 1.5px solid #14302F; border-radius: 12px; background: transparent; color: #14302F; font-family: inherit; font-size: 14px; font-weight: 700; padding: 0 14px; display: flex; align-items: center; gap: 8px; cursor: pointer">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 3h5v5"></path><path d="M4 20L21 3"></path><path d="M21 16v5h-5"></path><path d="M15 15l6 6"></path><path d="M4 4l5 5"></path></svg>Mezclar
</button>
</div>
<div style="display: flex; align-items: center; justify-content: space-between; gap: 10px">
<span style="font-size: 14px; font-weight: 700">Fondo</span>
<div role="group" aria-label="Fondo" style="padding: 3px; background: #E7DFCF; border-radius: 12px; display: flex; gap: 3px">
<sc-for list="{{temas}}" as="t" hint-placeholder-count="2">
<button aria-pressed="{{t.pressed}}" onClick="{{t.pick}}" style="min-height: 38px; border: 0; border-radius: 9px; background: {{t.bg}}; box-shadow: {{t.shadow}}; color: #14302F; font-family: inherit; font-size: 13px; font-weight: 700; padding: 0 14px; cursor: pointer">{{t.label}}</button>
</sc-for>
</div>
</div>
<label style="display: flex; align-items: center; justify-content: space-between; gap: 10px">
<span style="font-size: 14px; font-weight: 700">Título</span>
<input type="text" value="Mis aves de Ica" maxlength="22" style="width: 196px; min-height: 42px; box-sizing: border-box; border: 1px solid #C9BEA9; border-radius: 12px; background: #FFFFFF; color: #14302F; font-family: inherit; font-size: 14px; padding: 0 12px">
</label>
</section>

<p style="flex: none; margin: 10px 20px 0; font-size: 12.5px; line-height: 1.45; color: #4E5E5C">Al guardarlo queda fijo como Póster 1. Lo puedes descargar o compartir cuando quieras.</p>

<div style="margin-top: auto; padding: 0 16px 22px; flex: none">
<a href="PosterListo.dc.html" style="min-height: 52px; border-radius: 14px; background: #14302F; color: #FFFFFF; font-size: 15.5px; font-weight: 700; display: flex; align-items: center; justify-content: center; text-decoration: none">Guardar póster</a>
</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { seed: 7, tema: 'claro', mezclas: 0 };
  }
  renderVals() {
    const st = this.state;
    const temas = [{ id: 'claro', label: 'Claro' }, { id: 'oscuro', label: 'Oscuro' }];
    return {
      seed: st.seed,
      tema: st.tema,
      mezclas: st.mezclas === 0 ? 'ninguna' : String(st.mezclas),
      mezclar: () => this.setState({ seed: (st.seed * 31 + 17) % 9973 || 3, mezclas: st.mezclas + 1 }),
      temas: temas.map(t => ({
        label: t.label,
        pressed: st.tema === t.id ? 'true' : 'false',
        bg: st.tema === t.id ? '#FBF8F2' : 'transparent',
        shadow: st.tema === t.id ? '0 1px 2px rgba(20,48,47,0.14)' : 'none',
        pick: () => this.setState({ tema: t.id })
      }))
    };
  }
}
</script>
</body>
</html>
