<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Logo con los colores de la paleta</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<div style="width: {{ancho}}px; height: {{alto}}px; box-sizing: border-box; border-radius: {{radio}}px; background: {{fondo}}; display: flex; align-items: center; justify-content: center">
<svg width="{{marcaAncho}}" height="{{marcaAlto}}" viewBox="78 58 360 412" aria-hidden="true">
<g transform="rotate(-6 256 262)">
<path d="M140 86 H372 A40 40 0 0 1 412 126 V370 L338 444 H140 A40 40 0 0 1 100 404 V126 A40 40 0 0 1 140 86 Z" fill="{{tarjeta}}"></path>
<path d="M412 370 L338 444 C 346 408 368 380 412 370 Z" fill="{{doblez}}"></path>
<g fill="none" stroke="{{trazo}}" stroke-width="15" stroke-linecap="round" stroke-linejoin="round" transform="translate(91 86) scale(1.06)">
<path d="M156 28 L156 98"></path>
<circle cx="156" cy="117" r="18"></circle>
<path d="M156 136 C 136 146 132 186 140 216 C 146 236 166 236 172 216 C 180 186 176 146 156 136 Z"></path>
<path d="M140 160 L 30 146 L 37 172 L 60 167 L 63 188 L 88 181 L 92 200 L 140 192"></path>
<path d="M172 160 L 282 146 L 275 172 L 252 167 L 249 188 L 224 181 L 220 200 L 172 192"></path>
<path d="M144 230 L 128 290 L 146 283 L 156 302 L 166 283 L 184 290 L 168 230"></path>
</g>
<circle cx="362" cy="134" r="30" fill="{{sello}}" stroke="{{tarjeta}}" stroke-width="7"></circle>
<path d="M362 114l5.9 13.2 14.4 1.3-10.9 9.6 3.2 14.1-12.6-7.4-12.6 7.4 3.2-14.1-10.9-9.6 14.4-1.3z" fill="{{estrella}}"></path>
</g>
</svg>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"variante":{"editor":"enum","options":["icono","marca"],"default":"icono"},"size":{"editor":"int","default":120,"min":24,"max":512},"fondo":{"editor":null},"tarjeta":{"editor":null},"doblez":{"editor":null},"trazo":{"editor":null},"sello":{"editor":null},"estrella":{"editor":null},"$preview":{"width":120,"height":120}}'>
// El logo de Plumario (tarjeta-cromo girada, ave a trazo y sello con estrella) con los colores
// que le pase la paleta. Sin colores, usa los de la marca original (Logo.dc.html).
// «icono»: cuadrado redondeado con fondo. «marca»: solo la tarjeta, para ponerla sobre otro fondo.
class Component extends DCLogic {
  renderVals() {
    const p = this.props;
    const icono = (p.variante ?? 'icono') === 'icono';
    const size = Number(p.size ?? 120) || 120;
    const marcaAlto = icono ? Math.round(size * 0.8) : size;
    return {
      ancho: icono ? size : Math.round(size * 360 / 412),
      alto: size,
      radio: icono ? Math.round(size * 0.225) : 0,
      fondo: icono ? (p.fondo || '#14302F') : 'transparent',
      marcaAlto,
      marcaAncho: Math.round(marcaAlto * 360 / 412),
      tarjeta: p.tarjeta || '#F3EDE2',
      doblez: p.doblez || '#CFC4AF',
      trazo: p.trazo || '#14302F',
      sello: p.sello || '#E4C766',
      estrella: p.estrella || '#14302F'
    };
  }
}
</script>
</body>
</html>
