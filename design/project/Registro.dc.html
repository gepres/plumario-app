<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Crear cuenta</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&amp;family=Instrument+Sans:wght@400..700&amp;family=Instrument+Serif:ital@0;1&amp;display=swap">
<style>
body{margin:0}
a{color:#14302F}a:hover{color:#2C6A86}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; box-sizing: border-box; overflow: hidden; background: #F3EDE2; color: #14302F; font-family: 'Instrument Sans', 'Segoe UI', system-ui, sans-serif; display: flex; flex-direction: column">

<header style="flex: none; display: flex; align-items: center; gap: 4px; height: 56px; padding: 0 8px">
<a href="Login.dc.html" aria-label="Volver" style="width: 44px; height: 44px; border-radius: 12px; display: flex; align-items: center; justify-content: center; color: #14302F">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg>
</a>
<h1 style="margin: 0; font-family: 'Bricolage Grotesque', 'Avenir Next', system-ui, sans-serif; font-size: 20px; font-weight: 700">Crea tu cuenta</h1>
</header>

<p style="flex: none; margin: 0 20px 12px; font-size: 14px; line-height: 1.45; color: #3F504E; text-wrap: pretty">Tu álbum se guarda en tu cuenta: no pierdes tus aves si cambias de celular.</p>

<main style="flex: 1; min-height: 0; padding: 0 16px 18px; display: flex; flex-direction: column; gap: 12px">
<dc-import name="Campo" etiqueta="Nombre" tipo="texto" valor="" placeholder="Cómo te llamas" ayuda="Así aparece en tus pósteres." hint-size="358px,98px"></dc-import>
<dc-import name="Campo" etiqueta="Usuario" tipo="usuario" valor="" placeholder="tu_usuario" ayuda="Para intercambiar cromos. Lo ven otras personas." hint-size="358px,98px"></dc-import>
<dc-import name="Campo" etiqueta="Correo" tipo="correo" valor="" placeholder="tucorreo@ejemplo.com" hint-size="358px,76px"></dc-import>
<dc-import name="Campo" etiqueta="Contraseña" tipo="contrasena" valor="" placeholder="Crea una contraseña" ayuda="Mínimo 8 caracteres, con una letra y un número." hint-size="358px,98px"></dc-import>

<div style="display: flex; flex-direction: column; gap: 2px">
<sc-for list="{{checks}}" as="c" hint-placeholder-count="2">
<label style="min-height: 44px; display: flex; align-items: center; gap: 10px; font-size: 13.5px; line-height: 1.35; color: #3F504E; cursor: pointer">
<input type="checkbox" checked="{{c.on}}" onChange="{{c.toggle}}" style="flex: none; width: 20px; height: 20px; margin: 0; accent-color: #14302F">
<span>{{c.texto}}</span>
</label>
</sc-for>
</div>

<a href="{{href}}" aria-disabled="{{bloqueado}}" style="min-height: 52px; border-radius: 14px; background: {{btnBg}}; color: {{btnInk}}; font-size: 15.5px; font-weight: 700; display: flex; align-items: center; justify-content: center; text-decoration: none; cursor: {{cursor}}">Crear cuenta</a>
<p style="margin: auto 0 0; text-align: center; font-size: 14px; color: #3F504E">¿Ya tienes cuenta? <a href="Login.dc.html" style="display: inline-flex; min-height: 44px; align-items: center; font-weight: 700">Inicia sesión</a></p>
</main>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { terminos: true, edad: false };
  }
  renderVals() {
    const st = this.state;
    const listo = st.terminos && st.edad;
    return {
      checks: [
        { texto: 'Acepto los términos y la política de privacidad', on: st.terminos, toggle: () => this.setState({ terminos: !st.terminos }) },
        { texto: 'Tengo 14 años o más, o permiso de mi madre, padre o tutor', on: st.edad, toggle: () => this.setState({ edad: !st.edad }) }
      ],
      href: listo ? 'InicioVacio.dc.html' : '#',
      bloqueado: listo ? 'false' : 'true',
      btnBg: listo ? '#14302F' : '#E7DFCF',
      btnInk: listo ? '#FFFFFF' : '#5F5B54',
      cursor: listo ? 'pointer' : 'not-allowed'
    };
  }
}
</script>
</body>
</html>
