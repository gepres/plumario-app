<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Tu sobre está listo</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&amp;family=Instrument+Sans:wght@400..700&amp;family=Instrument+Serif:ital@0;1&amp;display=swap">
<style>
body{margin:0}
a{color:#F3EDE2}a:hover{color:#FFFFFF}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; box-sizing: border-box; overflow: hidden; background: radial-gradient(circle at 50% 38%, #24403A 0%, #0D1B18 68%); color: #FFFFFF; font-family: 'Instrument Sans', 'Segoe UI', system-ui, sans-serif">

<div aria-hidden="true" style="position: absolute; left: -105px; top: 40px; width: 600px; height: 600px; border-radius: 50%; background: radial-gradient(circle, rgba(13,27,24,0) 18%, #0D1B18 66%), repeating-conic-gradient(from 0deg, rgba(228,199,102,0) 0deg 7deg, rgba(228,199,102,0.08) 7deg 14deg)"></div>

<header style="position: absolute; left: 0; top: 0; width: 390px; box-sizing: border-box; height: 56px; padding: 0 8px; display: flex; align-items: center; justify-content: space-between">
<a href="Inicio.dc.html" aria-label="Cerrar" style="width: 44px; height: 44px; border-radius: 12px; display: flex; align-items: center; justify-content: center; color: #F3EDE2">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg>
</a>
<span style="font-size: 13px; font-weight: 700; color: #F3EDE2; background: rgba(243,237,226,0.12); border: 1px solid rgba(243,237,226,0.24); border-radius: 999px; padding: 6px 12px">Tienes 2 sobres</span>
<span aria-hidden="true" style="width: 44px"></span>
</header>

<sc-if value="{{enSobre}}" hint-placeholder-val="{{ true }}">
<section role="status" style="position: absolute; left: 0; top: 56px; width: 390px; box-sizing: border-box; padding: 0 28px; display: flex; flex-direction: column; align-items: center; gap: 2px; text-align: center">
<h1 style="margin: 0; font-family: 'Bricolage Grotesque', 'Avenir Next', system-ui, sans-serif; font-size: 28px; font-weight: 800; letter-spacing: -0.015em; line-height: 1.1">Tu sobre está listo</h1>
<p style="margin: 0; font-size: 14.5px; line-height: 1.4; color: #DCEBD3">Trae una pieza de una de estas 3 aves.</p>
</section>
</sc-if>

<div aria-hidden="true" style="position: absolute; left: 70px; top: 172px; width: 250px; height: 350px; border-radius: 16px; opacity: {{cartaOp}}; box-shadow: 0 0 62px 16px rgba(247,222,142,{{brillo}}); transform: translateY({{cartaY}}px) scale({{cartaEsc}}); transition: transform 0.7s cubic-bezier(0.2, 0.7, 0.2, 1), box-shadow 0.5s ease"></div>
<div style="position: absolute; left: 70px; top: 172px; width: 250px; height: 350px; opacity: {{cartaOp}}; transform: translateY({{cartaY}}px) scale({{cartaEsc}}); transition: transform 0.7s cubic-bezier(0.2, 0.7, 0.2, 1)">
<dc-import name="CartaDorso" size="250" hint-size="250px,350px"></dc-import>
</div>

<sc-if value="{{conSobre}}" hint-placeholder-val="{{ true }}">
<div style="position: absolute; left: 70px; top: 130px; width: 250px; height: 429px; clip-path: {{corteCuerpo}}; transform: translateY({{cuerpoY}}px); opacity: {{cuerpoOp}}; transition: transform 0.6s cubic-bezier(0.5, 0, 0.8, 0.4), opacity 0.4s ease 0.3s">
<dc-import name="Sobre" arte="{{arte}}" size="250" fijo="true" hint-size="250px,429px"></dc-import>
</div>
<div style="position: absolute; left: 70px; top: 130px; width: 250px; height: 429px; clip-path: {{corteTira}}; transform: translate({{tiraX}}px, {{tiraY}}px) rotate({{tiraGiro}}deg); transform-origin: 100% 8%; opacity: {{tiraOp}}; transition: transform 0.6s cubic-bezier(0.23, 1, 0.32, 1), opacity 0.4s ease 0.25s">
<dc-import name="Sobre" arte="{{arte}}" size="250" fijo="true" hint-size="250px,429px"></dc-import>
</div>
</sc-if>

<sc-if value="{{enSobre}}" hint-placeholder-val="{{ true }}">
<ul aria-label="Aves de este sobre" style="position: absolute; left: 20px; top: 568px; width: 350px; margin: 0; padding: 0; list-style: none; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
<sc-for list="{{aves}}" as="a" hint-placeholder-count="3">
<li style="display: flex; flex-direction: column; align-items: center; gap: 4px; text-align: center">
<span style="width: 56px; height: 56px; border-radius: 50%; overflow: hidden; background: #D2E4EC; box-shadow: 0 0 0 2px #E0B348; display: flex; align-items: center; justify-content: center"><img src="{{a.img}}" alt="" style="width: 50px; height: 50px"></span>
<span style="font-size: 12.5px; font-weight: 600; line-height: 1.2; color: #F3EDE2">{{a.nombre}}</span>
</li>
</sc-for>
</ul>

<div style="position: absolute; left: 20px; top: 668px; width: 350px; box-sizing: border-box; padding: 9px 14px; border-radius: 16px; background: rgba(243,237,226,0.08); border: 1px solid rgba(243,237,226,0.16); display: flex; flex-direction: column; gap: 6px">
<span style="font-size: 13.5px; font-weight: 700">2 de 3 para tu próximo sobre</span>
<div role="img" aria-label="2 de 3 observaciones" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px">
<span style="height: 6px; border-radius: 3px; background: #E4C766"></span>
<span style="height: 6px; border-radius: 3px; background: #E4C766"></span>
<span style="height: 6px; border-radius: 3px; background: rgba(243,237,226,0.16)"></span>
</div>
</div>

<button onClick="{{abrir}}" style="position: absolute; left: 20px; bottom: 24px; width: 350px; min-height: 52px; border-radius: 14px; border: 0; background: #F3EDE2; color: #14302F; font-family: inherit; font-size: 16px; font-weight: 700; cursor: pointer">Abrir sobre</button>
</sc-if>

<sc-if value="{{enEspera}}" hint-placeholder-val="{{ false }}">
<a href="SobreResultado.dc.html" aria-label="Revelar la carta" style="position: absolute; left: 60px; top: 150px; width: 270px; height: 378px; border-radius: 16px"></a>
<p style="position: absolute; left: 0; top: 556px; width: 390px; margin: 0; text-align: center; font-size: 16px; font-weight: 700; color: #F7DE8E">Toca la carta para revelarla</p>
</sc-if>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"arte":{"editor":"enum","options":["azar","nasca","pelicanos","paracas"],"default":"azar"},"$preview":{"width":390,"height":844}}'>
// Cada sobre sale con uno de los 3 diseños al azar. Es solo apariencia: no cambia lo que trae.
const SOBRES = ['nasca', 'pelicanos', 'paracas'];
const B = '/_blob/';

// El corte en zigzag: la tira superior y el cuerpo del sobre comparten la misma línea.
const DIENTES = 24;
const linea = Array.from({ length: DIENTES + 1 }, (_, i) => `${(i / DIENTES * 100).toFixed(2)}% ${i % 2 ? 9.6 : 10.8}%`);
const CORTE_TIRA = `polygon(0 0, 100% 0, ${[...linea].reverse().join(', ')})`;
const CORTE_CUERPO = `polygon(${linea.join(', ')}, 100% 100%, 0 100%)`;

class Component extends DCLogic {
  constructor(props) {
    super(props);
    const arte = SOBRES.includes(props.arte) ? props.arte : SOBRES[Math.floor(Math.random() * SOBRES.length)];
    this.state = { fase: 0, arte };
  }

  componentWillUnmount() {
    (this.relojes ?? []).forEach(clearTimeout);
  }

  luego(ms, cambios) {
    this.relojes = this.relojes ?? [];
    this.relojes.push(setTimeout(() => this.setState(cambios), ms));
  }

  renderVals() {
    const { fase, arte } = this.state;
    return {
      arte,
      enSobre: fase === 0,
      enEspera: fase === 4,
      conSobre: fase < 4,
      corteTira: CORTE_TIRA,
      corteCuerpo: CORTE_CUERPO,
      tiraX: fase >= 1 ? 170 : 0,
      tiraY: fase >= 1 ? -190 : 0,
      tiraGiro: fase >= 1 ? 28 : 0,
      tiraOp: fase >= 1 ? 0 : 1,
      cuerpoY: fase >= 3 ? 620 : 0,
      cuerpoOp: fase >= 3 ? 0 : 1,
      // Antes de cortar no hay carta que ver: los bordes del sobre son transparentes. Va dentro del
      // sobre, más angosta que él, y sale por el corte.
      cartaOp: fase === 0 ? 0 : 1,
      cartaY: [0, 0, -140, -8, -8][fase],
      cartaEsc: [0.8, 0.8, 0.8, 1.08, 1.08][fase],
      brillo: [0, 0, 0.2, 0.5, 0.8][fase],
      aves: [
        { nombre: 'Gaviota Peruana', img: B + 'b5eec4674d6792d4548b6095f45d701f' },
        { nombre: 'Churrete Marisquero', img: B + '89ed7ddd864a4dfd9365f48848612845' },
        { nombre: 'Pelícano Peruano', img: B + 'f5afd320701f9600c762979364a0f2e5' }
      ],
      abrir: () => {
        this.setState({ fase: 1 });
        this.luego(450, { fase: 2 });
        this.luego(1150, { fase: 3 });
        this.luego(1700, { fase: 4 });
      }
    };
  }
}
</script>
</body>
</html>
