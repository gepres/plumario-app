<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Mis repetidas</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&amp;family=Instrument+Sans:wght@400..700&amp;family=Instrument+Serif:ital@0;1&amp;display=swap">
<style>
body{margin:0}
a{color:#14302F}a:hover{color:#2C6A86}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; box-sizing: border-box; overflow: hidden; background: #F3EDE2; color: #14302F; font-family: 'Instrument Sans', 'Segoe UI', system-ui, sans-serif; display: flex; flex-direction: column">

<header style="flex: none; display: flex; align-items: center; gap: 4px; height: 56px; padding: 0 8px">
<a href="RecompensasStickers.dc.html" aria-label="Volver" style="width: 44px; height: 44px; border-radius: 12px; display: flex; align-items: center; justify-content: center; color: #14302F">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg>
</a>
<h1 style="margin: 0; font-family: 'Bricolage Grotesque', 'Avenir Next', system-ui, sans-serif; font-size: 20px; font-weight: 700">Mis repetidas</h1>
</header>

<section aria-label="Tu saldo de plumas" style="flex: none; margin: 0 16px; padding: 12px 14px; background: #14302F; color: #FFFFFF; border-radius: 18px; display: flex; align-items: center; gap: 12px">
<dc-import name="MonedaPluma" size="44" hint-size="44px,44px"></dc-import>
<div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px">
<span style="font-family: 'Bricolage Grotesque', 'Avenir Next', system-ui, sans-serif; font-size: 22px; font-weight: 800; line-height: 1.1">34 plumas</span>
<span style="font-size: 12.5px; line-height: 1.35; color: #C9D8D4">Ganas 1 por observación válida y más al reciclar repetidas.</span>
</div>
</section>

<main style="flex: none; padding: 14px 16px 0; display: flex; flex-direction: column; gap: 14px">
<sc-for list="{{grupos}}" as="g" hint-placeholder-count="2">
<section style="display: flex; flex-direction: column; gap: 8px">
<div style="display: flex; align-items: baseline; justify-content: space-between">
<h2 style="margin: 0; font-family: 'Bricolage Grotesque', 'Avenir Next', system-ui, sans-serif; font-size: 16px; font-weight: 700">{{g.nombre}}</h2>
<span style="font-size: 13px; font-weight: 600; color: #4E5E5C">{{g.total}}</span>
</div>
<sc-for list="{{g.piezas}}" as="p" hint-placeholder-count="2">
<div style="background: #FBF8F2; border: 1px solid #E3DACA; border-radius: 16px; padding: 8px 10px; display: flex; flex-direction: column; gap: 8px">
<div style="display: flex; align-items: center; gap: 10px">
<dc-import name="StickerAve" img="{{p.img}}" nombre="" num="{{p.num}}" tint="#D2E4EC" acabado="{{g.acabado}}" size="48" hint-size="48px,62px"></dc-import>
<span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px">
<span style="font-size: 14.5px; font-weight: 700; line-height: 1.2">{{p.nombre}}</span>
<span style="font-size: 12.5px; color: #4E5E5C">{{p.cuantas}}</span>
</span>
</div>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
<a href="IntercambioProponer.dc.html" style="min-height: 44px; border-radius: 12px; background: #14302F; color: #FFFFFF; font-size: 13.5px; font-weight: 700; display: flex; align-items: center; justify-content: center; text-decoration: none">Cambiar</a>
<a href="MisRepetidas.dc.html" style="min-height: 44px; box-sizing: border-box; border-radius: 12px; border: 1.5px solid #C9BEA9; color: #14302F; font-size: 13.5px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 6px; text-decoration: none"><dc-import name="MonedaPluma" size="18" hint-size="18px,18px"></dc-import>Reciclar · {{g.valor}} plumas</a>
</div>
</div>
</sc-for>
</section>
</sc-for>
</main>

<p style="flex: none; margin: 10px 20px 0; font-size: 12.5px; line-height: 1.45; color: #4E5E5C">Cambiar una repetida rinde más que reciclarla. Los sobres no traen holográficos.</p>

<div style="position: absolute; left: 0; bottom: 0; width: 390px; height: 104px"><dc-import name="BarraNav" activo="recompensas" hint-size="390px,104px"></dc-import></div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const B = '/_blob/';
    return {
      grupos: [
        { nombre: 'Oro', total: '1 repetida', acabado: 'oro', valor: 5, piezas: [
          { nombre: 'Churrete Marisquero', num: '042', img: B + '18a594851a3daeba964a8c03ebaaf837', cuantas: 'Tienes 1 de más' }
        ] },
        { nombre: 'Plata', total: '2 repetidas', acabado: 'plata', valor: 2, piezas: [
          { nombre: 'Gaviotín Zarcillo', num: '025', img: B + 'cdb078ae3f20d0b791f60aa76ef64daf', cuantas: 'Tienes 2 de más' }
        ] }
      ]
    };
  }
}
</script>
</body>
</html>
